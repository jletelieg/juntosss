t": false, "features": {"prevention": 1.0, "mental": 0.4}, "tags": ["salud mental"], "tagsEditorial": true, "canonical": "consejeria-36"}, {"id": "consejeria-37", "number": 37, "sectionNumber": 1, "source": "consejeria", "title": "Mi Abogada Madrina", "description": "Buscamos conectar a alumnas de Derecho UC con abogadas de distintas áreas que sean sus “madrinas profesionales”, compartiendo experiencias, consejos y orientación laboral. Para ello, trabajaremos junto a PADE para agregar al programa de Mentorías una iniciativa exclusiva para mujeres, creando redes de apoyo y acercando a las alumnas a referentes femeninos del mundo jurídico.", "pillar": "Vocación social", "section": "Mujer en la Academia", "joint": false, "features": {"women_career": 1.0, "professional_mentoring": 0.6, "career": 0.3}, "tags": ["feminismo", "profesión"], "tagsEditorial": true, "canonical": "consejeria-37"}, {"id": "consejeria-38", "number": 38, "sectionNumber": 2, "source": "consejeria", "title": "La Pluma Morada", "description": "Queremos crear una revista anual que visibilice el trabajo y los aportes de las mujeres en el mundo jurídico y académico. Incluirá entrevistas a profesoras, reconocimiento a alumnas destacadas, publicaciones relevantes, columnas de opinión y noticias sobre mujeres que asumen nuevos cargos o alcanzan hitos importantes en el Derecho.", "pillar": "Vocación social", "section": "Mujer en la Academia", "joint": false, "features": {"women_research": 1.0, "research": 0.4, "expression": 0.5}, "tags": ["feminismo", "academia"], "tagsEditorial": true, "canonical": "consejeria-38"}, {"id": "consejeria-39", "number": 39, "sectionNumber": 3, "source": "consejeria", "title": "La Contingencia Morada", "description": "La realidad de las mujeres y los avances en materia de igualdad cambian constantemente. Por eso, a través de Contingencia Morada, queremos mantener a los estudiantes alerta e informados, difundiendo oportunamente las novedades de la agenda feminista, tan pronto como surjan: nuevas leyes y reformas, sentencias con perspectiva de género y debates jurídicos y sociales sobre los derechos de las mujeres.", "pillar": "Vocación social", "section": "Mujer en la Academia", "joint": false, "features": {"gender_law": 1.0, "dialogue": 0.4, "inclusion": 0.4}, "tags": ["feminismo", "academia"], "tagsEditorial": true, "canonical": "consejeria-39"}, {"id": "consejeria-40", "number": 40, "sectionNumber": 4, "source": "consejeria", "title": "Aquí Estamos", "description": "Queremos que ninguna estudiante tenga que enfrentar sola una situación de violencia, acoso o abuso sexual. Por eso, desde la Consejería ofreceremos acompañamiento personalizado y, siempre que sea su voluntad, ayudaremos a gestionar junto con la DAE y las unidades correspondientes medidas de apoyo, como cambios de sección para evitar compartir espacios con el agresor/es o ajustes en la carga académica.", "pillar": "Vocación social", "section": "Mujer en la Academia", "joint": false, "features": {"violence_support": 1.0, "safety": 0.6, "support_meeting": 0.5}, "tags": ["feminismo", "seguridad"], "tagsEditorial": true, "canonical": "consejeria-40"}, {"id": "consejeria-41", "number": 41, "sectionNumber": 1, "source": "consejeria", "title": "Puente Jurídico", "description": "Muchas veces, poner nuestros conocimientos al servicio de la sociedad comienza por quienes tenemos más cerca. Por eso, queremos ofrecer a los funcionarios de Casa Central orientación jurídica gratuita para resolver dudas, conocer sus derechos y enfrentar distintas situaciones legales, reconociendo y apoyando a quienes son parte fundamental de nuestra vida universitaria.", "pillar": "Vocación social", "section": "Rol Social del Abogado", "joint": false, "features": {"legal": 0.6, "staff": 0.8, "volunteering": 0.4}, "tags": ["servicio", "comunidad"], "tagsEditorial": true, "canonical": "consejeria-41"}, {"id": "consejeria-42", "number": 42, "sectionNumber": 2, "source": "consejeria", "title": "Pasantías con Sentido", "description": "Buscamos generar convenios de pasantías con fundaciones, como Desafío Levantemos Chile o Fundación Las Rosas, para que los estudiantes de 3° a 5° puedan poner sus conocimientos al servicio de iniciativas con impacto social. El proyecto contempla una charla informativa para conocer las organizaciones, seguida de una instancia más dinámica para conocer sus áreas de trabajo, y un proceso de selección coordinado con cada institución.\n\nAdemás, queremos en conjunto con el CADE, seguir dando continuidad al programa de pasantías pro bono de la Fundación Pro Bono, generando nuevas oportunidades para que más estudiantes puedan acceder a estas experiencias.", "pillar": "Vocación social", "section": "Rol Social del Abogado", "joint": false, "features": {"social_internship": 1.0, "volunteering": 0.5, "legal": 0.5, "career": 0.4}, "tags": ["servicio", "profesión"], "tagsEditorial": true, "canonical": "pasantias"}, {"id": "consejeria-43", "number": 43, "sectionNumber": 3, "source": "consejeria", "title": "ConCiencia Cívica", "description": "Muchas veces, lo que aprendemos en la universidad parece lejano a la realidad, pero el Derecho está presente en nuestra vida cotidiana. Por eso, queremos llevar a cabo una iniciativa para que estudiantes de la Facultad puedan dictar clases de Educación Cívica en comunidades con menor acceso a esta información, creando espacios cercanos y dinámicos para conversar sobre temas relevantes para la vida en sociedad.", "pillar": "Vocación social", "section": "Rol Social del Abogado", "joint": true, "features": {"civic_teaching": 1.0, "volunteering": 0.5, "dialogue": 0.4}, "tags": ["servicio", "compromiso país"], "tagsEditorial": true, "canonical": "civica"}, {"id": "consejeria-44", "number": 44, "sectionNumber": 1, "source": "consejeria", "title": "MAPADRES a tu Ritmo", "description": "Cada estudiante vive la universidad de manera distinta y, para quienes son madres o padres, compatibilizar los estudios con la vida familiar implica desafíos particulares. Por eso, junto con la DAE, organizaremos reuniones individuales para apoyarlos en la toma de ramos y buscaremos dialogar con las autoridades para flexibilizar las causales de rezago, considerando las urgencias imprevistas que puede implicar el cuidado de un hijo.", "pillar": "Vocación social", "section": "Nuestros Padres y Madres", "joint": false, "features": {"caregiving": 1.0, "course_choice": 0.3, "regulation": 0.4}, "tags": ["mapadres", "orientación"], "tagsEditorial": true, "canonical": "consejeria-44"}, {"id": "consejeria-45", "number": 45, "sectionNumber": 1, "source": "consejeria", "title": "Red de Referentes", "description": "Organizaremos conversatorios con abogados y profesionales LGBTQ+ para conocer sus experiencias en el mundo laboral, los desafíos que han enfrentado y cómo han desarrollado sus carreras. Además, prepararemos y difundiremos una guía práctica con información sobre derechos laborales, situaciones de discriminación, cómo actuar frente a ellas y qué organismos pueden orientar o recibir denuncias.", "pillar": "Vocación social", "section": "Diversidad", "joint": false, "features": {"diversity_career": 1.0, "inclusion": 0.5, "career": 0.4}, "tags": ["inclusión", "profesión"], "tagsEditorial": true, "canonical": "consejeria-45"}, {"id": "consejeria-46", "number": 46, "sectionNumber": 2, "source": "consejeria", "title": "Derecho sin Discriminación", "description": "El Derecho evoluciona con la sociedad y nuestra formación también debe hacerlo. Por eso, en conjunto con el CADE, organizaremos un ciclo de charlas sobre leyes contra la discriminación, abordando su aplicación práctica, desafios y posibles mejoras. Entre ellas, la Ley Zamudio, la Ley de Matrimonio Igualitario y la Ley Karin, con foco en sus efectos y mecanismos de implementación.", "pillar": "Vocación social", "section": "Diversidad", "joint": true, "features": {"inclusion": 1.0, "gender_law": 0.4}, "tags": ["inclusión", "academia"], "tagsEditorial": true, "canonical": "discriminacion"}, {"id": "consejeria-47", "number": 47, "sectionNumber": 1, "source": "consejeria", "title": "Congreso: Memoria, Derechos y Futuro", "description": "Queremos llevar a cabo un Congreso interdisciplinario impulsado por estudiantes y académicos de nuestra Facultad, que genere un espacio de reflexión y propuestas frente a los desafíos del Chile actual, con miras a construir el país del futuro. A través de distintos exponentes, abordaremos la protección de los derechos como pilar fundamental de la democracia, en torno a seis ejes: (1) derechos sociales y su exigibilidad, (2) datos personales y vida privada, (3) nuevas tecnologías y derechos humanos, (4) exigibilidad en el derecho internacional, (5) consumo y (6) naciones emergentes.", "pillar": "Vocación social", "section": "Memoria y Derechos Humanos", "joint": false, "features": {"rights_research": 1.0, "research": 0.4, "dialogue": 0.4}, "tags": ["memoria", "academia"], "tagsEditorial": true, "canonical": "consejeria-47"}, {"id": "consejeria-48", "number": 48, "sectionNumber": 2, "source": "consejeria", "title": "Memoría Jurídica", "description": "Proponemos organizar visitas a los archivos de la Vicaría de la Solidaridad para conocer documentos originales, analizar el papel de las instituciones jurídicas durante un período clave de la historia de Chile y comprender cómo estos registros permiten estudiar la evolución del Derecho y preservar la memoria histórica del país.", "pillar": "Vocación social", "section": "Memoria y Derechos Humanos", "joint": false, "features": {"memory": 1.0, "research": 0.4}, "tags": ["memoria", "academia"], "tagsEditorial": true, "canonical": "consejeria-48"}, {"id": "consejeria-49", "number": 49, "sectionNumber": 1, "source": "consejeria", "title": "Todo Claro", "description": "Sabemos que para los estudiantes que cuentan con adecuaciones en sus evaluaciones, muchas veces puede existir incertidumbre sobre cómo se desarrollarán las pruebas. Por ejemplo, un estudiante con discapacidad visual puede no saber si rendirá una evaluación oral frente al profesor, o si serán 6 preguntas que serán transcritas posteriormente.\n\nPara ello, trabajaremos junto con la Dirección de Aprendizaje y Acompañamiento Académico y la DAE en un protocolo y catastro de adecuaciones, procurando que la información llegue oportunamente a ayudantes y profesionales involucrados, para que así, cada estudiante pueda enfrentar sus evaluaciones con una mayor tranquilidad.", "pillar": "Vocación social", "section": "Inclusión", "joint": false, "features": {"academic_accessibility": 1.0, "accessibility": 0.5}, "tags": ["inclusión", "evaluaciones"], "tagsEditorial": true, "canonical": "consejeria-49"}, {"id": "consejeria-50", "number": 50, "sectionNumber": 2, "source": "consejeria", "title": "Avancemos Juntos", "description": "Queremos conectar a estudiantes del programa Dirección de Aprendizaje y Acompañamiento Académico con profesionales que han vivido experiencias similares, para que puedan acompañarlos como mentores, compartir sus experiencias y orientarlos frente a los desafíos de la universidad y el mundo laboral.", "pillar": "Vocación social", "section": "Inclusión", "joint": false, "features": {"accessible_mentoring": 1.0, "accessibility": 0.5, "professional_mentoring": 0.4}, "tags": ["inclusión", "profesión"], "tagsEditorial": true, "canonical": "consejeria-50"}, {"id": "consejeria-51", "number": 51, "sectionNumber": 3, "source": "consejeria", "title": "Facultad sin Barreras", "description": "Junto a estudiantes con discapacidad y en coordinación con el CADE y la DAE, identificaremos las barreras físicas, académicas y digitales de la Facultad, incluyendo la accesibilidad de los espacios y la asignación de salas. Presentaremos los resultados a la\n\nDirección y haremos seguimiento de las mejoras, buscando anticipar dificultades y garantizar condiciones adecuadas para todos los estudiantes.", "pillar": "Vocación social", "section": "Inclusión", "joint": true, "features": {"accessibility": 1.0}, "tags": ["inclusión", "infraestructura"], "tagsEditorial": true, "canonical": "barreras"}, {"id": "consejeria-52", "number": 52, "sectionNumber": 1, "source": "consejeria", "title": "Más allá de Santiago", "description": "Sabemos que las oportunidades laborales para los abogados no se limitan a Santiago y que existen múltiples alternativas para desarrollar una carrera profesional en regiones. Por eso, queremos organizar charlas con abogados que ejerzan fuera de la Región Metropolitana, para conocer sus experiencias, y además incorporar a la Feria del Trabajo un espacio dedicado a estudios jurídicos y oficinas que se desempeñen en distintas regiones del país.", "pillar": "Vocación social", "section": "Regiones", "joint": false, "features": {"regional_career": 1.0, "career": 0.5}, "tags": ["regiones", "profesión"], "tagsEditorial": true, "canonical": "consejeria-52"}, {"id": "consejeria-53", "number": 53, "sectionNumber": 2, "source": "consejeria", "title": "Domingos de Sobremesa", "description": "Estar lejos de casa no siempre es fácil, especialmente los domingos, cuando más se extraña a la familia y los amigos. Por eso, queremos organizar almuerzos, tardes de películas, juegos, picnics y otros panoramas para quienes se quedan en Santiago los fines de semana, poniendo especial énfasis en los novatos, que están comenzando su vida universitaria y adaptándose a una nueva ciudad.", "pillar": "Vocación social", "section": "Regiones", "joint": false, "features": {"community": 1.0, "city": 0.3, "rest": 0.3}, "tags": ["regiones", "comunidad"], "tagsEditorial": true, "canonical": "consejeria-53"}, {"id": "consejeria-54", "number": 54, "sectionNumber": 1, "source": "consejeria", "title": "College to Derecho", "description": "Sabemos que los estudiantes de College cuentan con una instancia para conocer mejor su programa, pero queremos ofrecerles, junto a la Consejería de College, un espacio de orientación especializado en Derecho. Este busca guiarlos en la elección de ramos y profesores, la estructuración de su malla y darles a conocer las distintas actividades sociales, políticas y académicas de la Facultad.", "pillar": "Vocación social", "section": "College", "joint": false, "features": {"college_guidance": 1.0, "course_choice": 0.7, "information": 0.3}, "tags": ["college", "malla"], "tagsEditorial": true, "canonical": "consejeria-54"}, {"id": "consejeria-55", "number": 55, "sectionNumber": 2, "source": "consejeria", "title": "Te Acompaño en Derecho", "description": "Proponemos crear una red de tutores de College, integrada por estudiantes de cuarto y quinto año que hayan ingresado a Derecho por esta vía, para acompañar a quienes están comenzando. La idea es compartir experiencias y resolver dudas sobre la malla, la toma de ramos y las oportunidades que ofrece la Facultad, facilitando su adaptación a la carrera.", "pillar": "Vocación social", "section": "College", "joint": false, "features": {"college_guidance": 1.0, "mentoring": 0.8}, "tags": ["college", "orientación"], "tagsEditorial": true, "canonical": "consejeria-55"}, {"id": "consejeria-56", "number": 56, "sectionNumber": 3, "source": "consejeria", "title": "College al Día", "description": "Los estudiantes de College en proceso de traspaso a Derecho no reciben las comunicaciones de la Facultad de Derecho UC, quedando fuera de información relevante sobre actividades, oportunidades y procesos académicos. Por eso, queremos incorporarlos a estos canales oficiales para que estén informados y puedan participar plenamente de la vida universitaria.", "pillar": "Vocación social", "section": "College", "joint": false, "features": {"information": 1.0, "academic_information": 0.4}, "tags": ["college", "información"], "tagsEditorial": true, "canonical": "consejeria-56"}, {"id": "consejeria-57", "number": 57, "sectionNumber": 1, "source": "consejeria", "title": "¡Dale otra página!", "description": "¿Por qué comprar un libro nuevo cuando otro estudiante ya tiene uno que puede volver a usarse? Por eso, queremos organizar una feria de intercambio de libros a comienzos de año, para que los estudiantes puedan darles una segunda vida a sus textos y encontrar los que necesitan para sus nuevos ramos. Así, fomentaremos la reutilización, reduciremos el consumo innecesario de papel y promoveremos una Facultad más sustentable.", "pillar": "Vocación social", "section": "MedioAmbiente", "joint": true, "features": {"books": 1.0, "environment": 0.8, "study": 0.3}, "tags": ["medioambiente", "cultura"], "tagsEditorial": true, "canonical": "libros"}];
const PROGRAMS={"cade": {"title": "CADe", "fullTitle": "Centro de Alumnos", "count": 79, "pdf": "programa-cade.pdf", "intro": "NUESTRO RELATO\n\nTodos llegamos a Derecho UC por distintos motivos: algunos, con la certeza de haber encontrado su vocación; otros, con dudas, expectativas y miedos. La universidad no es igual para todos: cada uno la vive a su manera. Sabemos que encontrar un lugar en la Facultad puede ser difícil. Muchas veces se logra por un golpe de suerte: alguien que estuvo ahí, que nos invitó, nos escuchó o nos ayudó cuando más lo necesitábamos. Pero creemos que encontrar nuestro lugar no puede depender del azar, de ser extrovertido o de los amigos con los que entramos a la carrera. El Centro de Alumnos tiene que ser ese alguien: el que se acerca al otro y le da la oportunidad de hacerse parte. Ahí nace nuestra invitación: construir una Facultad JUNTOS. A ti, que te cansaste de los discursos vacíos; a ti, que solo quieres estudiar para ser un excelente abogado; a ti, que nunca te has sentido invitado, pero que tienes el potencial de hacer de esta Facultad un lugar mejor. Es a ti a quien necesitamos, porque sin tu huella y tu historia cualquier proyecto queda vacío.\n\nQueremos que el protagonista de la Facultad sea el alumno. Esa es la razón que nos mueve a actuar con convicción y compromiso. El Centro de Alumnos tiene que ser cercano, de los alumnos y para los alumnos: debe abrir espacios de diálogo y encuentro, escucharte y poner sus recursos al servicio de lo que quieras construir, asegurándose de que tengas todas las oportunidades y caminos abiertos para hacerlo. Un CADe que deje de prometer y empiece a trabajar para ti. Pero si esto se promete todos los años, ¿cómo nos aseguramos de que se haga realidad? Con tres compromisos, cada uno con un método de acción concreto.\n\n1. JUNTOS,                                              EL ENCUENTRO HUMANO CARA A CARA: Hoy vivimos la Facultad en carriles separados. La exigencia, la competitividad y el individualismo propios de la carrera nos encierran en nuestras notas y nos alejan de quienes tenemos al lado. Queremos cambiar eso, y el primer paso es formar un CADe que conozca a sus compañeros, que sea conocido por ellos y que esté presente en las salas, los pasillos, la biblioteca y cada generación, formando verdaderos lazos humanos. La excelencia académica pierde su valor si en el camino nos volvemos extraños para quienes comparten nuestro mismo esfuerzo. No se trata solo de obtener un título, sino de comprender que nuestra profesión se forja en el trato humano, en las dificultades compartidas y en la convicción de que ninguna nota vale la pena si perdemos la capacidad de reconocernos entre nosotros. Por eso, queremos derribar las barreras que hoy nos separan.\n\nPorque quien ofrece soluciones tiene que conocer primero las necesidades. Así, JUNTOS, construimos una Facultad más humana.\n\n2. JUNTOS EN                                                         UN CADE PROACTIVO ACCIÓN: No basta con que el CADe sea cercano: conocernos es el punto de partida, no la meta. Necesitamos un CADe que no espere en su oficina a que los problemas lleguen, sino que recorra la Facultad, pregunte, escuche y detecte lo que está pasando en cada generación antes de que se transforme en una crisis. Ningún problema es menor si afecta a un compañero. El CADe no puede limitarse a decir que está a disposición: tiene que salir a tender la mano. A quienes hoy no ven en el Centro de Alumnos un espacio que los interpele y convoque; a quienes no están en el Patio de Derecho porque sienten que no tienen un lugar ahí; a quienes todavía no han podido elegir cómo vivir su experiencia universitaria porque no han encontrado su espacio en esta comunidad; y a quienes la representación estudiantil no ha sabido acompañar. Una vez detectado un problema, hay que actuar con rapidez, eficiencia y seguimiento, pero, sobre todo, con creatividad. Las soluciones de hoy no han sido suficientes, y es responsabilidad del CADe pensar fuera de la caja e innovar tanto en la forma de acercarse como en la forma de resolver los problemas del día a día. Un post o una cadena de WhatsApp ya no bastan: si nuestro compromiso es llegar a todos, los mecanismos también tienen que ser distintos, innovadores y efectivos. Basta de diagnósticos que se repiten año a año sin soluciones. Queremos buscarlas por nuestros compañeros y con ellos, y trabajar sin descanso hasta ver sus frutos.\n\nJUNTOS salimos al encuentro de cada compañero, con rapidez y creatividad, para que tu paso por la universidad sea mejor.\n\n3. JUNTOS, CADA UNO CON                                              EL ALUMNO PROTAGONISTA SU SELLO: Hoy el Centro de Alumnos se entiende como el protagonista de toda acción: lidera los proyectos y realiza constantemente cientos de actividades. De cierta manera, eso copa los espacios que tiene un alumno para participar, liderar un equipo, idear proyectos y sacarlos adelante. El protagonista de Derecho UC eres tú, y el Centro de Alumnos tiene que trabajar hasta el cansancio para que así sea en la práctica y puedas aprovechar todo el potencial de la experiencia universitaria: hacer, crear y aprender. Su rol no es ocupar todos los espacios, sino abrirlos, para que cada uno pueda armar su vida universitaria a su manera, sabiendo que cuenta con un CADe que lo apoya. También reconocemos que enfocarse en la carrera, sin involucrarse más allá, es una decisión válida y legítima. Lo que buscamos es que nadie que quiera ser protagonista se quede fuera por falta de apoyo o por sentir que no hay lugar para él fuera de los espacios tradicionales. Cada estudiante tiene algo propio que aportar, y cuando alguien no encuentra su espacio en nuestra Facultad, no solo pierde esa persona: perdemos todos, y pierde Chile.\n\nJUNTOS, cada uno desde su lugar, somos Derecho UC.\n\n¿POR QUÉ JUNTOS? Porque es frente a un país tan dividido y polarizado cuando más necesitamos estar juntos. Juntos, porque nuestra Facultad necesita que lo que nos diferencia no nos divida, sino que nos enorgullezca y nos permita ver el enorme potencial desaprovechado de esa diversidad tan rica y característica de Derecho UC. Juntos, porque tenemos que levantar entre todos las soluciones que hoy necesitan nuestros compañeros. Juntos, porque sin ti la Facultad no está completa. Juntos, para que dejemos de ser espectadores y empecemos a ser protagonistas de la Facultad que queremos y del país que soñamos. Juntos, para que nadie sea ajeno a su propia historia. Y juntos, porque si seguimos separados, vivir la universidad al máximo seguirá siendo un privilegio de pocos, y perderán nuestros compañeros, nuestra Facultad y Chile."}, "consejeria": {"title": "Consejería Académica", "fullTitle": "Consejería Académica", "count": 57, "pdf": "programa-consejeria.pdf", "intro": "PROGRAMA CONSEJERÍA 2026\n\nRELATO\n\nEn Derecho UC no hay una sola forma de vivir la universidad: hay quienes llegan sabiendo qué quieren y otros que todavía lo están descubriendo; algunos dan sus primeros pasos de inmediato y otros necesitan un poco más de tiempo. Todos, sin embargo, hemos vivido situaciones en las que no hemos sabido a quién acudir: dudas para las cuales no tenemos respuesta, evaluaciones que se juntan y no podemos abordar, algún desafío académico que no sabemos cómo enfrentar, entre varias otras.\n\nY sabemos también lo que cambia cuando alguna ayuda salvadora aparece: una tutora que te escribe después de tu primera solemne, un compañero que te pasa sus apuntes, alguien que te dice “tú también puedes ser parte de esto”… Son cosas que hacen entender que la Facultad puede ser mucho más que clases, pruebas y notas.\n\nDerecho UC está lleno de oportunidades, pero acceder a ellas no debería depender de la suerte, de conocer a la persona indicada o de atreverse a dar el primer paso sin saber qué viene después. Esta Consejería nace con esa convicción: ninguna oportunidad debería quedar fuera de tu alcance por no saber dónde buscarla.\n\nPor eso, queremos una Consejería que comience escuchando. No llegamos con una lista cerrada de problemas y soluciones, porque cada estudiante vive la Facultad de manera distinta y nadie sabe mejor que ustedes lo que hace falta. Por eso, no venimos a decidir el camino de nadie, sino a acompañarte en él. Queremos ayudarte a evaluar opciones, a dar tus primeros pasos y a compatibilizar las exigencias de la carrera con todo aquello extraacadémico que hace que estos años realmente valgan la pena.\n\nPara llegar a esa meta, identificamos que la Consejería que queremos no se construye únicamente a través de iniciativas aisladas o de charlas orientadoras. Necesitamos una Consejería sólida, ordenada y capaz de responder a las necesidades de sus estudiantes. Por eso, nuestra propuesta se estructura en torno a una base, tres pilares y un propósito común:\n\n● Nuestra base es la INSTITUCIONALIDAD: Queremos fortalecer los cimientos de la Consejería, ordenar su funcionamiento, definir responsabilidades de sus miembros y transparentar su rol. Que todos sepan qué hacemos, cómo funcionamos y donde pueden acudir a nosotros. Creemos que impulsar numerosos proyectos no es suficiente si no contamos con una base sólida que permita llevarlos a cabo, darles continuidad y generar cambios reales.\n\n● Sobre esa base, creemos que son tres los pilares en los cuales se puede agrupar el trabajo de la Consejería: (1) VOCACIÓN ACADÉMICA, (2) VOCACIÓN SOCIAL, y (3) VOCACIÓN JURÍDICA. Estas son las áreas que orientarán nuestro trabajo y desde las cuales abordaremos las distintas necesidades de los estudiantes: su vida en comunidad, sus desafíos académicos y su rol como profesional.\n\n● Lo anterior, finalmente, tiene como propósito LA CERCANÍA Y LA COMUNIDAD: Queremos una Consejería presente, que escuche, acompañe y facilite el camino de cada estudiante. Una Consejería que no esté solo detrás de una oficina, sino que también en el patio.\n\nQueremos, en suma, una Facultad en la que encontrar tu lugar no sea cuestión de suerte, donde las oportunidades estén al alcance de todos y donde, aunque no todos recorramos el mismo camino, sí podamos siempre sentirnos acompañados. *"}};
