 const features=PROJECT_FEATURES[p.id],featureMatches=Object.entries(features).map(([feature,weight])=>({feature,weight,contribution:(direct[feature]||0)*weight})).filter(m=>m.contribution>0).sort((a,b)=>b.contribution-a.contribution);
 const relevance=featureMatches.reduce((sum,m)=>sum+m.contribution,0)/Math.sqrt(Object.values(features).reduce((a,b)=>a+b*b,0));
 const contextMatches=contexts.filter(c=>p.tags.includes(c));
 const contextBonus=contextMatches.length?1.2+Math.min(.3,(contextMatches.length-1)*.3):0;
 const collegeMismatch=p.tags.includes('college')&&!contexts.includes('college')&&!(interests.mentoring>0);
 const degreeMismatch=p.tags.includes('gradistas')&&!contexts.includes('gradistas');
 const briefBonus=styles.has('brief')&&BRIEF_PROJECTS.has(p.id)&&relevance>0?.15:0;
 const pairedBonus=styles.has('accompanied')&&[7,41,46,50,51,52,55].includes(p.id)&&relevance>0?.15:0;
 return {...p,score:relevance+contextBonus+briefBonus+pairedBonus-(collegeMismatch||degreeMismatch?20:0),signalScore:relevance,featureMatches,contextMatches,contextMatch:contextMatches.length>0};
 }).sort((a,b)=>b.score-a.score||a.id-b.id);
 const eligible=ranked.filter(p=>p.score>=0),recommended=[],seenSignals={};
 // Evita que cinco variantes del mismo interés ocupen todo el resultado cuando
 // también se eligieron otras actividades o apoyos con afinidad explícita.
 while(recommended.length<5){let best=null,bestUtility=-Infinity;for(const candidate of eligible){if(recommended.some(p=>p.id===candidate.id))continue;const signal=candidate.featureMatches[0]?.feature||'exploration';const utility=candidate.score/(1+1.2*(seenSignals[signal]||0));if(utility>bestUtility){best=candidate;bestUtility=utility;}}if(!best)break;recommended.push(best);const signal=best.featureMatches[0]?.feature||'exploration';seenSignals[signal]=(seenSignals[signal]||0)+1;}
 // Asegura que hasta dos contextos explícitos tengan presencia sin sustituir
 // todas las recomendaciones por proyectos de etapa universitaria.
 const covered=new Set(recommended.flatMap(p=>p.contextMatches));let inserted=0;
 for(const context of contexts){if(covered.has(context))continue;const p=eligible.find(p=>p.contextMatches.includes(context)&&!recommended.some(x=>x.id===p.id));if(p&&inserted<2){const index=4-inserted;recommended[index]=p;p.contextMatches.forEach(c=>covered.add(c));inserted++;}}
 const selectedStyles=Array.from(styles);
 const highlights=Object.entries(direct).filter(([feature,w])=>w>0&&!['study','logistics','budget','continuity'].includes(feature)).sort((a,b)=>b[1]-a[1]).slice(0,3).map(([feature])=>FEATURES[feature][0]);
 return {axes,primary,secondary,contexts,ranked,recommended,interests,needs,styles:selectedStyles,highlights};
}
function reasonFor(p,result){
 const pieces=[];
 if(p.featureMatches.length){const feature=p.featureMatches[0].feature;pieces.push(FEATURES[feature][1].replace('Indicastes','Indicaste'));}
 if(p.contextMatches.length)pieces.push('Además, se relaciona con '+p.contextMatches.map(c=>CONTEXT_NAMES[c]).join(' y ')+'.');
 if(!pieces.length)return 'Una propuesta para explorar: tus respuestas no expresan una afinidad específica con este proyecto.';
 return pieces.join(' ');
}

const PROJECTS=[{"id": 1, "title": "Carretea Seguro", "tags": ["discriminación", "seguridad"], "description": "Un carrete es seguro cuando todos pueden disfrutarlo. Incorporaremos a la capacitación general de los OA’s un módulo específico para saber cómo actuar frente al acoso y los discursos de odio contra compañeros de la comunidad, ya sea por su orientación sexual, religión, nacionalidad o sexo: cómo intervenir, cómo acompañar y a quién derivar, con fiscalización y un compromiso explícito de cada OA. Que nadie tenga que cuidarse solo."}, {"id": 2, "title": "Derecho sin Discriminación", "tags": ["discriminación"], "description": "El Derecho avanza con la sociedad, y nuestra formación también tiene que hacerlo. Organizaremos junto a la Consejería un ciclo de charlas sobre las leyes que han marcado avances contra la discriminación, ya sea por su orientación sexual, por su origen o por su sexo, y sobre cómo funcionan cuando hay que aplicarlas: ▸ Ley N° 20.609 (Ley Zamudio): cómo opera la acción contra la discriminación arbitraria y qué tan eficaz ha sido. ▸ Ley N° 21.400 (matrimonio igualitario): sus efectos en filiación, incluida la doble filiación, con una mirada a la experiencia comparada. ▸ Ley N° 21.643 (Ley Karin): su aplicación frente a la discriminación laboral, qué se puede mejorar y cómo se implementan los protocolos de prevención y los reglamentos internos de orden, higiene y seguridad, en el sector público y en empresas."}, {"id": 3, "title": "Catastro de Bienestar", "tags": ["discriminación", "bienestar"], "description": "Aplicaremos un catastro riguroso para poder estudiar de manera real cómo se sienten nuestros compañeros de la comunidad LGBTQ+ en la Facultad, las situaciones de discriminación que pueden haber vivido en la carrera, entre otros elementos. El objetivo de este proyecto es poder tener claridad de situaciones de discriminación que muchas veces se quedan en la experiencia personal y no permiten trabajar sobre ellos para presentar propuestas y soluciones concretas a la Facultad, además de visibilizar estas situaciones."}, {"id": 4, "title": "Mesa Antidiscriminación", "tags": ["discriminación"], "description": "Ninguna denuncia debería quedar sin respuesta. Instalaremos mesas de trabajo para elaborar protocolos claros frente a casos de discriminación, ya sea por orientación sexual, religión, nacionalidad o sexo."}, {"id": 5, "title": "Eight CADe", "tags": ["cultura"], "description": "Las batallas de rap son de lo más esperado de la SSA, y no queremos que se queden ahí. Llevaremos una competencia de freestyle al patio de Derecho para que ese espíritu se viva más de una vez al año. Micrófono abierto, rimas y barras para todos."}, {"id": 6, "title": "La Vuelta al CADe en 80 Días", "tags": ["cultura"], "description": "Estudiamos en uno de los barrios más emblemáticos de Santiago y debemos aprovecharlo. Organizaremos salidas al casco histórico y a los lugares culturales que rodean Casa Central, en fechas que no choquen con el calendario académico. Pensadas especialmente para nuestros compañeros de región y novatos, para que conozcan el barrio donde estudiarán sus próximos años."}, {"id": 7, "title": "CADetouille", "tags": ["cultura", "comunidad"], "description": "Dicen que la comida une a las personas, y la vamos a poner a prueba. CADetouille es un ciclo de talleres gastronómicos donde aprenderemos a cocinar platos de distintas culturas: salir del estrés de las pruebas, ensuciarse las manos en equipo y terminar todos en una gran mesa. Para estar verdaderamente JUNTOS, nada mejor que compartir el pan."}, {"id": 8, "title": "Fiebre de CADe", "tags": ["cultura", "servicio"], "description": "Haremos una ronda de Tiny Desk en la salita del CADe los que serán evaluados por jueces y eligieron a los dos mejores. Con ellos realizaremos una tocata solidaria en un bar que será a beneficio de algún proyecto de nuestra facultad. El que reciba más cariño del público, podrá grabar una canción a elección en un estudio."}, {"id": 9, "title": "El CADe de Da Vinci", "tags": ["cultura", "salud mental"], "description": "El break en el patio puede ser más que un café y una simple conversación. Instalaremos un gran lienzo en blanco para que cualquiera tome un pincel y se olvide, aunque sea por cinco minutos, de sus solemnes y exámenes."}, {"id": 10, "title": "El CADe Viste de Prada", "tags": ["cultura", "medio ambiente"], "description": "Una gran feria de intercambio: traes la ropa que ya no usas. La cambias por fichas y te llevas otras prendas. Todos están invitados: estudiantes, profesores y funcionarios. Le daremos una segunda vida a nuestra ropa y aportamos al cuidado del todos JUNTOS."}, {"id": 11, "title": "CADe 451", "tags": ["cultura"], "description": "Un proyecto para que los libros vuelvan a circular: intercambio de libros entre estudiantes, recomendaciones de lecturas entretenidas y una pequeña biblioteca abierta en la sala del CADe para intercambiar libros durante el año. Lleva uno, deja otro."}, {"id": 12, "title": "Club de cine", "tags": ["cultura"], "description": "El club de cine consiste en ir a ver una película al cine UC, comer cabritas y luego compartiremos en la oficina del CADe para comentar los aspectos más interesantes."}, {"id": 13, "title": "Nos Auxiliamos JUNTOS!", "tags": ["salud mental"], "description": "Cuidar a otros también se aprende. Abriremos una capacitación en primeros auxilios psicológicos a toda la comunidad: herramientas concretas y tips para saber qué hacer cuando un amigo o compañero lo está pasando mal. Es algo que ya está para los representantes, pero creemos que es fundamental hacerlo juntos."}, {"id": 14, "title": "A Un Click", "tags": ["salud mental"], "description": "Pedir ayuda no debería ser un trámite. Articularemos con Salud UC para facilitar el acceso a atención psicológica, psiquiátrica y el número 5.000. Crearemos una página que reúna todos los servicios disponibles y explique paso a paso cómo usarlos: dónde pedir hora, a quién acudir y qué esperar. Menos trámites y más rapidez, pedir ayuda no puede esperar."}, {"id": 15, "title": "Está Bien No Estar Bien", "tags": ["salud mental"], "description": "Semana de concientización sobre salud mental, enfocada en las situaciones menos visibilizadas dentro de la Facultad. Contempla hitos comunicacionales, charlas y videos con profesionales invitados que muestren las soluciones existentes y transmitan la seriedad del tema. Se suman cápsulas en que profesores de la Facultad entregan recomendaciones prácticas de autocuidado, manejo del estrés académico y búsqueda de ayuda, para acercar el tema y validarlo desde la propia comunidad académica."}, {"id": 16, "title": "La suma de las cosas pequeñas", "tags": ["salud mental", "gestión"], "description": "La salud mental de los estudiantes suele verse afectada por la suma de muchas cosas pequeñas, por lo que requiere un abordaje integral y sostenido en el tiempo. Este proyecto propone un diagnóstico y catastro serios sobre la situación de salud mental en la Facultad, que de verdad sirvan como base para tomar medidas y no queden en un trámite. Con estos resultados se sostendrá una reunión con la DAE para coordinar respuestas institucionales, se fortalecerá la consejería y se elaborará un plan estratégico de mediano plazo, con responsables y seguimiento."}, {"id": 17, "title": "Sin Receta No", "tags": ["salud física", "salud mental"], "description": "Campaña para desnormalizar la automedicación y el consumo de fármacos sin prescripción, especialmente en épocas de alta carga académica, informando sus riesgos y las alternativas disponibles. El enfoque es preventivo y de cuidado: proteger y orientar, no instalar una lógica de vigilancia entre pares."}, {"id": 18, "title": "CADe RUN", "tags": ["deporte", "salud física"], "description": "Zapatillas puestas y a correr JUNTOS. Una corrida abierta a toda la Facultad, estudiantes, profesores y funcionarios, para combatir el sedentarismo y despejar la mente."}, {"id": 19, "title": "La búsqueda del deporte", "tags": ["deporte", "salud física"], "description": "Gestionaremos convenios con gimnasios cercanos para que entrenar sea más accesible para los estudiantes. Como sabemos la dificultad de la gestión de estos convenios siendo 1800 alumnos en derecho, buscaremos instalar una mesa de trabajo en conjunto con las demás facultades de Casa Central, para hacer más efectiva la discusión de esta materia."}, {"id": 20, "title": "JUNTOS nos desconectamos", "tags": ["salud mental", "comunidad"], "description": "Durante las semanas de solemnes y exámenes, todos los miércoles llevaremos al patio café, snacks, música y juegos rápidos para ofrecer a los estudiantes un momento de descanso en medio de la carga académica. La idea es crear un espacio breve y de libre acceso, al que se pueda llegar entre estudio y estudio, para despejarse, compartir con otros y volver a estudiar con mejor ánimo. Parte de la convicción de que el descanso no es una pérdida de tiempo, sino una condición para rendir bien: un respiro a tiempo también es parte de estudiar."}, {"id": 21, "title": "Cada Segundo Cuenta", "tags": ["salud física"], "description": "Taller práctico de RCP abierto a toda la comunidad de la Facultad, realizado en el patio para hacerlo visible, accesible y de participación espontánea. Estará a cargo de instructores capacitados y enseñará a reconocer un paro cardiorrespiratorio, activar la cadena de emergencia, realizar compresiones torácicas y usar un desfibrilador externo automático (DEA), con práctica en maniquíes."}, {"id": 22, "title": "Conversemos JUNTOS!", "tags": ["compromiso país"], "description": "Como queremos una comunidad informada y activa respecto a temas de contingencia nacional, prepararemos un plan de dos etapas que permita estas instancias de diálogo y conversación. Partiendo con una charla con un experto en temas de relevancia de contingencia nacional luego daremos espacios de diálogo tipo cabildo abierto, con preguntas guiadas y en un círculo completamente horizontal, analizaremos lo que pasa en Chile y el mundo. Sin tarimas y con respeto."}, {"id": 23, "title": "Choque de Titanes 2.0", "tags": ["compromiso país"], "description": "Traemos a los profesores y expositores más destacados a debatir frente a frente en el patio sobre lo que está ocurriendo a nivel país. Es importante informarnos y formar opinión sobre la contingencia nacional."}, {"id": 24, "title": "Un Día en Valparaíso", "tags": ["compromiso país"], "description": "El Congreso no se entiende igual desde la sala de clases. Organizaremos una visita para presenciar sesiones de comisión, preparadas con una ficha del proyecto que se discute ese día y seguidas de una conversación con asesores legislativos. Ver cómo se hace una ley cambia la forma de estudiarla."}, {"id": 25, "title": "Tu Columna", "tags": ["compromiso país"], "description": "Las ideas de los estudiantes de Derecho merecen llegar más allá de la sala. Daremos un espacio permanente para publicar columnas de estudiantes de todas las sensibilidades sobre la contingencia nacional y propulsaremos que manden sus columnas a los diarios nacionales."}, {"id": 26, "title": "Del Aula al Servicio Público", "tags": ["compromiso país"], "description": "Muchos egresados de la Facultad han servido al país desde ministerios, el Congreso, tribunales y municipios, en gobiernos. Los invitaremos a contar cómo es trabajar en lo público: qué se aprende, qué cuesta y por qué vale la pena. Queremos que la vocación de servicio sea una opción real para cada estudiante."}, {"id": 27, "title": "Ingeniería de la Transición", "tags": ["compromiso país", "memoria"], "description": "Chile volvió a la democracia por un camino jurídico. Analizaremos el plebiscito de 1988, la reforma constitucional de 1989 y los acuerdos de los primeros años, traeremos invitados para hablar sobre cómo se llevó a cabo el proceso de la transición."}, {"id": 28, "title": "La Iglesia y los Derechos Humanos", "tags": ["compromiso país", "memoria"], "description": "Durante esos años, la Iglesia chilena impulsó el Comité Pro Paz y la Vicaría de la Solidaridad, donde muchos abogados defendieron a las personas sin distinción. Como comunidad de la Universidad Católica, revisaremos esa historia, su trabajo jurídico y el legado de quienes lo hicieron posible, con visitas a su archivo y conversaciones con quienes participaron."}, {"id": 29, "title": "Calendario de la Acción", "tags": ["servicio"], "description": "Todo el impacto social en un solo lugar. Un calendario mensual único con las fechas, horarios y salidas de todos los proyectos sociales. El CADe se encarga visibilizar, tú eliges dónde quieres aportar."}, {"id": 30, "title": "Shark Tank Social", "tags": ["servicio"], "description": "¿Tienes una idea para ayudar, pero te faltan el café, los vasos o los materiales? Ven con tu grupo, preséntanos tu proyecto y vemos cómo el CADe te ayuda a llevarlo a la práctica."}, {"id": 31, "title": "Feria de proyectos sociales", "tags": ["servicio"], "description": "Una vez por semestre, el patio de la Facultad se convertirá en una exposición de proyectos sociales. Invitaremos a iniciativas de la UC y de organizaciones externas a mostrar su trabajo, sumar voluntarios y conectar con estudiantes que quieran aportar. El CADe apoyará su difusión y abrirá un espacio para que nuestra comunidad conozca y se involucre en causas que mejoran la vida de otros."}, {"id": 32, "title": "TuFuturo.CADe", "tags": ["servicio"], "description": "Junto a otras facultades y una municipalidad de escasos recursos, organizaremos una feria vocacional para que estudiantes de enseñanza media conozcan las carreras y los caminos que tienen por delante. Abrir la universidad a quienes la ven lejos."}, {"id": 33, "title": "Generaciones JUNTAS", "tags": ["servicio"], "description": "Visitas a hogares de adultos mayores para acompañarlos y ver si tienen alguna necesidad concreta en la que podamos ayudar.."}, {"id": 34, "title": "CADe en Emergencia", "tags": ["servicio"], "description": "Cuando Chile se ve golpeado por una catástrofe, Derecho UC responde. Protocolo para que el CADe tome la iniciativa y movilice a voluntarios, formando un bloque permanente que se movilice ante la emergencia."}, {"id": 35, "title": "Mujeres en la Cárcel", "tags": ["feminismo", "servicio"], "description": "Una realidad que casi nadie mira. El proyecto tiene dos fases: una campaña masiva de recolección en el patio para armar kits de higiene (toallas higiénicas, jabón, shampoo) y jornadas de visita coordinadas con la Capellanía Carcelaria o fundaciones afines para ir a conocer a las reclusas, sus experiencias y acompañar. De esta manera, conocemos desde dentro las deficiencias del sistema penal."}, {"id": 36, "title": "La caja morada", "tags": ["feminismo"], "description": "Dentro del baño de nuestra Facultad existe una caja de insumos menstruales que, lamentablemente, suele estar vacía. Por eso, nos comprometemos a estar pendientes de su reposición, buscando que siempre cuente con los insumos necesarios para que cualquier mujer pueda acceder a ellos en caso de necesitarlos."}, {"id": 37, "title": "Carta a Mi Yo de Primero", "tags": ["feminismo", "novatos"], "description": "Las alumnas de cursos superiores escriben una carta a las futuras estudiantes de Derecho: lo que les habría gustado saber, cómo enfrentar los prejuicios y qué consejos les darían. Las cartas se entregan al inicio del año siguiente, con el contacto de su autora, para que cada novata decida si quiere conocerla. Algo distinto a las madrinas."}, {"id": 38, "title": "¡Volvamos JUNTAS!", "tags": ["feminismo", "seguridad"], "description": "Una red de apoyo de alumnas de la Facultad, a través de un grupo de WhatsApp, para coordinarse y volver acompañadas después de clases, carretes o actividades, incluyendo traslados compartidos."}, {"id": 39, "title": "8m JUNTAS!", "tags": ["feminismo"], "description": "Vivamos el día de la mujer todo el mes, con actividades que nos invitan a encontrarnos, reflexionar y actuar como comunidad. Planteamos 4 ejes, uno para abarcar cada semana: maternidad, vida laboral, violencia y derecho."}, {"id": 40, "title": "Manual del Foráneo", "tags": ["regiones"], "description": "Convenios, descuentos, becas, etc. Todo lo que te habría gustado saber al llegar."}, {"id": 41, "title": "Fin de Semana JUNTOS", "tags": ["regiones", "comunidad"], "description": "Cuando es viernes muchos vuelven con su familia, otros se quedan en Santiago. Organizaremos salidas a distintos lugares de la capital el fin de semana para que quienes se queden tengan con quién compartir y conocer la ciudad. Que nadie tenga que pasar solo los fines de semana."}, {"id": 42, "title": "Comer Bien Lejos de Casa", "tags": ["regiones", "salud física"], "description": "Comer bien no debería ser un lujo en época de solemnes. Buscaremos convenios con proveedores de comida casera y congelados, y compartiremos un menú de recetas sanas, rápidas y baratas, en conjunto con el pilar de Salud Mental y Física."}, {"id": 43, "title": "Comunidad de WhatsApp foráneos", "tags": ["regiones", "comunicación"], "description": "Queremos que cada uno se sienta cómodo en su vida en la capital. Queremos comunicarnos con ustedes de forma más directa a través distintos grupos como transporte, datos, panoramas, etc."}, {"id": 44, "title": "Comunidad de WhatsApp Oficial", "tags": ["comunidad", "comunicación"], "description": "Un canal donde solo escribe el CADe: actividades, eventos y votaciones, sin ruido. Para cuando Instagram queda olvidado en período de solemnes. Además, cada vocalía tendrá su propio canal: suscríbete solo a lo que te interesa."}, {"id": 45, "title": "Kit Novatos", "tags": ["novatos"], "description": "El primer día no llegas solo. Te esperamos en la facultad con un kit que tiene todo lo que necesitas: un mapa con las salas de Casa Central, tips útiles sobre tus profesores y el contacto de tus representantes. Así, desde el día uno, sabes que en Derecho UC siempre hay alguien a quien acudir."}, {"id": 46, "title": "Almuerzo CADe + Paquetes", "tags": ["novatos", "comunidad"], "description": "Queremos conocerte de verdad. Como CADe almorzaremos en la oficina con cada paquete para escuchar qué te preocupa, qué te entusiasma y qué esperas de tu paso por Derecho UC. Tú pones las ganas y conversando nosotros ponemos la mesa. Que ningún novato quede afuera."}, {"id": 47, "title": "Lockers para Todos", "tags": ["infraestructura"], "description": "Hay muy pocos lockers y la demanda es mucha. Ordenaremos y fiscalizaremos su uso, y gestionaremos con la Facultad la instalación de más lockers para que todos tengan dónde guardar sus cosas."}, {"id": 48, "title": "Parque Placentero", "tags": ["comunidad", "infraestructura"], "description": "El patio también se juega. Sumaremos a las mesas de ping-pong dos spikeballs, para que hayan más actividades para realizar en cada momento del día en el patio. Puedes usarlo siempre que necesites, no sólo en épocas de campaña."}, {"id": 49, "title": "Zorro no te lo lleves", "tags": ["infraestructura"], "description": "Compraremos mesas plegables para que cuando haya actividades externas en el patio no se usen todas las mesas y todos tengan un lugar donde sentarse."}, {"id": 50, "title": "Padrinos y Madrinas Todo el Año", "tags": ["novatos"], "description": "El sistema queda abierto durante todo el año, para que quien no consiguió madrina o padrino al inicio no pierda la oportunidad, con responsabilidades claras y seguimiento para que ningún ahijado quede botado a mitad de semestre."}, {"id": 51, "title": "Institucionalización Padrino-Ahijado", "tags": ["novatos"], "description": "Queremos que el vínculo de los padrinos con sus ahijados no se queden solamente en su relación personal. Organizaremos un almuerzo entre tríos de padrinos para que los ahijados puedan conocerse entre sí y compartan sus experiencias durante sus primeros meses en la universidad."}, {"id": 52, "title": "Paquetes Hermanos", "tags": ["novatos", "comunidad"], "description": "Muchos compartimos ramos, pero no los conocemos realmente. Organizaremos encuentros entre paquetes, para estudiar juntos, compartir apuntes y conocer más gente de la generación. Una oportunidad para aprender mejor y, de paso, conocer a más compañeros de la generación."}, {"id": 53, "title": "Pasaporte Derecho", "tags": ["novatos", "comunidad"], "description": "Un pasaporte con actividades para conocer la facultad (asistir a un evento, conocer la Clínica, ir a tribunales, etc), con un premio al completarlo. Convierte la integración en algo concreto y entretenido."}, {"id": 54, "title": "Conozcámonos JUNTOS", "tags": ["funcionarios", "comunidad"], "description": "Guardias, personal de aseo y administrativos: los vemos todos los días, pero pocas veces sabemos sus nombres. En cada cumpleaños publicaremos un post con su nombre, sus gustos y algún dato freak, para que todos los conozcamos mejor. Ellos también son parte de nuestra comunidad."}, {"id": 55, "title": "Desayuno con Funcionarios", "tags": ["funcionarios", "comunidad"], "description": "Un desayuno con funcionarios y trabajadores de la universidad, en un espacio más íntimo, para conocerlos y agradecerles todo lo que hacen por la Facultad."}, {"id": 56, "title": "Facultad sin Barreras", "tags": ["discapacidad", "infraestructura"], "description": "Realizaremos, junto a estudiantes con discapacidad, un diagnóstico de las barreras físicas, académicas y digitales de la Facultad, como el acceso a la biblioteca destinada a personas con discapacidad. Presentaremos sus resultados a la Dirección y haremos seguimiento público de su corrección."}, {"id": 57, "title": "Compañero tutor", "tags": ["discapacidad", "novatos"], "description": "Todos los años el CADe realiza un programa para que los estudiantes de primer año tengan un tutor. Para nuestros compañeros de primer año que cuenten con alguna discapacidad los tutores recibirán una preparación previa mediante talleres especializados, para que puedan ejercer su rol con responsabilidad y conocimiento."}, {"id": 58, "title": "Guía Única de Recursos", "tags": ["discapacidad"], "description": "Un documento, en formatos accesibles, que reúna todos los beneficios, servicios, contactos y procedimientos de la UC para estudiantes con discapacidad. Hoy esa información suele estar dispersa."}, {"id": 59, "title": "Beca Intercampus", "tags": ["college"], "description": "Sabemos que muchos estudiantes de college aún tienen muchos ramos en San Joaquín, lo que implica tener que movilizarse entre campus y gastar prácticamente el doble en trayectos. Para esto, queremos incorporar la beca intercampus donde daremos de forma mensual un apoyo para la carga de la TNE a estudiantes de college que lo necesiten."}, {"id": 60, "title": "Starter Pack College", "tags": ["college", "novatos"], "description": "Una versión del Starter Pack Novato adaptada a quienes llegan desde College: la guía de continuidad, contactos, un mapa de Casa Central y los beneficios del CADe. Que conozcan la esencia de nuestra Facultad. Queremos formar la comunidad de derecho UC todos JUNTOS."}, {"id": 61, "title": "Tutores x College", "tags": ["college", "novatos"], "description": "Los compañeros de College que continúen sus estudios en Derecho y lo deseen podrán contar con un tutor: un estudiante de cursos superiores de la Facultad, idealmente alguien que también haya llegado por esta vía, que los acompañará en su llegada a la carrera y a Casa Central. Los tutores recibirán una preparación previa mediante talleres, para que puedan orientar con conocimiento en la malla, los trámites de continuidad y la vida de la Facultad."}, {"id": 62, "title": "Poniéndote al Día", "tags": ["college"], "description": "Sabemos que muchos de nuestros compañeros de college llegan el segundo semestre y no tienen la oportunidad de conocer todas las iniciativas y proyectos que existen en nuestra facultad. Vamos a organizar un conversatorio para que todos puedan ponerse al día de lo que se han perdido hasta llegar a Derecho."}, {"id": 63, "title": "La Otra Cara: El Podcast de los Profes", "tags": ["comunidad"], "description": "La Otra Cara es nuestro podcast donde sentamos a los profesores fuera de la sala de clases para conocer su lado más humano: historias, fracasos, anécdotas universitarias y consejos reales, para escuchar camino a la Facultad."}, {"id": 64, "title": "Mapa CADe", "tags": ["comunidad", "regiones"], "description": "Todo lo bueno alrededor de Casa Central, en un solo mapa. Lugares para hacer deporte, restaurantes, tiendas, centros culturales y panoramas del barrio, recomendados por los propios estudiantes. Para el novato que recién llega, para quien todavía no conoce bien Santiago y para cualquiera que quiera salir de la rutina."}, {"id": 65, "title": "Voluntariado Arriba la Comuna", "tags": ["servicio"], "description": "Voluntariado con nuestros compañeros de medicina y comercial. Ir un fin de semana a alguna localidad a entregar asistencia jurídica, operativo de salud y clases de finanzas. Además de apoyo académico a niños con lenguaje, matemáticas, historia y ciencia en la medida de lo posible."}, {"id": 66, "title": "Congreso Miremos Chile", "tags": ["compromiso país"], "description": "Congreso que reúna a personas relevantes en el debate público, alumnos universitarios y alumnos secundarios, con exposiciones e instancias de diálogo en torno al futuro del país y cómo construir desde el respeto a las instituciones y la democracia, el diálogo y la academia."}, {"id": 67, "title": "Asociación de Músicos Universitarios Derecho UC", "tags": ["cultura"], "description": "Grupo para juntar, potenciar y articular a los distintos músicos de Derecho UC, generar instancias en que puedan reconocerse en esta gran comunidad, conocerse, conectar, generar proyectos e instancias y compartir información y experiencias."}, {"id": 68, "title": "Que vuelva el deporte en Casa Central", "tags": ["deporte", "infraestructura"], "description": "Queremos que hacer deporte sea una alternativa real dentro de la jornada universitaria, como un espacio de bienestar y una pausa frente a las exigencias de la carrera. Para ello, impulsaremos dos gestiones concretas:\n\n● Camarines y resguardo de pertenencias: Identificaremos los camarines existentes en Casa Central y gestionaremos su acceso para estudiantes. Si no es posible utilizarlos, presentaremos una propuesta para habilitar un espacio donde cambiarse y guardar pertenencias, identificando los recintos disponibles, los costos y las autorizaciones necesarias. ● Mejoramiento del espacio polideportivo: Presentaremos a la universidad una propuesta de acondicionamiento que haga más cómodo y atractivo hacer ejercicio en este lugar en el patio de medicina. Esta incluirá la instalación de una carpa u otra solución que otorgue mayor privacidad, sujeta a las condiciones técnicas del espacio."}, {"id": 69, "title": "Reforma Vocalías", "tags": ["gestión", "comunidad"], "description": "Las vocalías son los brazos con que el CADe levanta proyectos y trae las soluciones y oportunidades directamente a los alumnos. Son además un espacio clave en que los alumnos pueden involucrarse en liderar proyectos, trabajar en equipo y poder encontrar un espacio en la facultad donde ser protagonistas. Sin embargo, hoy las vocalías están muy separadas del CADe, siendo organismos que tienden a poner mucha presión sobre los Jefes de Vocalía que terminan quedando solos y a la deriva. Por esto proponemos una reforma que considere los siguientes ejes: ● Jefes de Vocalía son parte del CADe: Son una pieza fundamental en la labor del Centro de Alumnos, por lo que deberían tener un rol mucho más presente en la orgánica del mismo. Las reuniones entre el CADe y los jefes deberían ser mucho más relevantes y periódicas. ● Equipo de vocalías: Incentivar a que las vocalías tengan un equipo que considere comunicaciones, logística, financiamiento, entre otros. Las personas que forman parte de la vocalía son verdaderamente parte de un equipo en donde tienen una función específica."}, {"id": 70, "title": "TNE Gradista", "tags": ["beneficios", "gradistas"], "description": "Cuando uno está estudiando el grado pierde el beneficio de la TNE. Esto, además de traer problemas económicos para los alumnos, trae consigo problemas relativos a generar una barrera para salir de la casa, estudiar en lugares distintos y moverse, lo cual es esencial para la salud mental durante este delicado período. Proponemos presentar a la Facultad esta necesidad tan relevante, para lograr levantar una solución y dar la calidad de alumno en vías de titulación durante los 8 primeros meses después de egresar, de manera de no perder esos beneficios."}, {"id": 71, "title": "Créditos Gradistas", "tags": ["beneficios", "gradistas"], "description": "Sabemos que el problema de imprimir muchas páginas no es un problema que se queda en quinto año. Los gradistas tienen miles de paginas de estudiar y tienen que costear todas estas de su propio presupuesto. Gestionaremos con la facultad y la DAE la posibilidad de que los gradistas mantengan sus créditos en la CRISOL para que afrontar este periodo sea más ameno."}, {"id": 72, "title": "Presupuesto JUNTOS", "tags": ["transparencia", "manejo financiero"], "description": "La plata del CADe es de todos, y todos deberían saber cómo se va a usar antes de que se gaste. A comienzos de año presentaremos un presupuesto anual con partidas claras: eventos, vocalías, proyectos sociales, funcionamiento y reserva, indicando cuánto se destinará a cada una y con qué objetivo. El presupuesto se presentará a los representantes de generación y se publicará para toda la Facultad. Si durante el año es necesario modificar una partida de manera importante, lo informaremos con su justificación. Al cierre, compararemos lo presupuestado con lo efectivamente gastado, para que cualquiera pueda evaluar si cumplimos."}, {"id": 73, "title": "Lo que Recibimos, lo Entregamos", "tags": ["manejo financiero", "continuidad"], "description": "Un centro de alumnos no debería heredar menos de lo que recibió el anterior. Nos comprometemos a dejar a la próxima directiva, como mínimo, el mismo saldo que recibiremos al asumir. Al comenzar, publicaremos el saldo que recibimos, conciliado con la cartola bancaria y descontando las deudas pendientes. Al terminar, publicaremos el saldo que entregamos, calculado de la misma forma. Así cada directiva responde por lo que recibió y por lo que deja, y la siguiente puede partir con la tranquilidad de tener recursos para trabajar desde el primer día."}, {"id": 74, "title": "Cada Evento con su Balance", "tags": ["transparencia", "manejo financiero"], "description": "Fiestas, carretes y eventos son donde más plata se mueve y donde más fácil es perderle el rastro. Por eso, después de cada evento publicaremos su balance: cuánto costó, cuánto se recaudó y cuál fue el resultado, con el detalle de los principales gastos e ingresos. Cuentas claras en cada evento para que, al final del año, las cuentas del CADe cuadren."}, {"id": 75, "title": "El reciclaje también suma", "tags": ["medio ambiente", "comunidad"], "description": "La cantidad de papel que usamos cada semestre es increíble: páginas y páginas de apuntes que terminan en la basura después del periodo de exámenes. Queremos que esto deje de ser así. Por eso, incorporaremos a la Semana San Alfonso una prueba de reciclaje de apuntes, en la que la generación que logre reunir la mayor cantidad de apuntes efectivamente utilizados recibirá el puntaje correspondiente a una prueba de la SSA (categoría por confirmar)."}];

const icon=(name,cls='')=>`<svg class="icon ${cls}" viewBox="0 0 24 24" aria-hidden="true">${icons[name]||icons.spark}</svg>`;
const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const main=document.querySelector('#main'),dialog=document.querySelector('#project-dialog');
const KEY='juntos-vivir-derecho-v2';
let state={view:'home',step:0,answers:Array(15).fill(null)},result=null,shared=false,lastView='home';
let librarySearch='',libraryTag='';
function persist(){try{localStorage.setItem(KEY,JSON.stringify({answers:state.answers,step:state.step}));}catch{}}
function restore(){try{const saved=JSON.parse(localStorage.getItem(KEY));if(saved&&Array.isArray(saved.answers)&&saved.answers.length===15){state.answers=saved.answers.map((v,i)=>validAnswer(QUESTIONS[i],v)?(Array.isArray(v)?[...v]:v):null);state.step=Math.max(0,Math.min(14,Number(saved.step)||0));}}catch{}}
restore();
function focusMain(){window.scrollTo({top:0,behavior:'instant'});main.focus({preventScroll:true});}
function toast(msg){const t=document.querySelector('#toast');t.textContent=msg;t.hidden=false;clearTimeout(toast.timer);toast.timer=setTimeout(()=>t.hidden=true,4200);}
function setView(view){state.view=view;render();focusMain();}
function render(){document.querySelector('#header-note').hidden=state.view!=='home';document.querySelector('#nav-program').textContent=state.view==='library'?'Volver al test ↗':'El programa ↗';main.className=`wrap ${state.view==='home'?'intro-wrap':''}`;({home:renderHome,quiz:renderQuestion,result:renderResult,library:renderLibrary})[state.view]();}
function heroArt(){const points=[[15,23,-12],[70,20,12],[79,56,-9],[58,70,9],[20,67,-12],[3,48,8]];return `<div class="hero-art" aria-hidden="true"><span class="art-top">Hay muchas formas de ser parte.</span><div class="art-ring"></div><div class="art-center">${icon('people')}</div>${points.map((p,i)=>`<span class="sticker" style="left:${p[0]}%;top:${p[1]}%;--rot:${p[2]}deg;background:${PROFILES[i+1].color};color:#17485c">${icon(PROFILES[i+1].icon)}</span>`).join('')}<span class="art-caption">Y también hay una para ti.</span></div>`;}
function renderHome(){const count=state.answers.filter((a,i)=>validAnswer(QUESTIONS[i],a)).length;main.innerHTML=`<div class="hero fade-in"><div><div class="eyebrow">El test de JUNTOS</div><h1>¿Cuál es tu forma de vivir <em>Derecho?</em></h1><p>Hay mucho más que clases y apuntes. Descubre tu perfil y los proyectos que más conectan contigo.</p><button class="cta" id="start">${count>0&&count<15?'Continuar mi test':count===15?'Ver mi resultado':'Descubrir mi perfil'} ${icon('arrow')}</button><p class="hero-small">15 preguntas · unos 3 minutos · sin registro</p>${count>0?'<button class="text-button" id="restart-home">Empezar de nuevo</button>':''}</div>${heroArt()}</div><div class="feature-row"><div class="feature"><span class="mini-icon">${icon('spark')}</span><span><b>7 perfiles</b>Tu propia mezcla</span></div><div class="feature"><span class="mini-icon">${icon('heart')}</span><span><b>75 proyectos</b>Encuentra los tuyos</span></div><div class="feature"><span class="mini-icon">${icon('share')}</span><span><b>Tu resultado</b>Listo para compartir</span></div></div><p class="bottom-note">Un test de intereses para explorar nuestro programa. Tus respuestas se guardan solo en este dispositivo.</p>`;document.querySelector('#start').onclick=()=>{if(count===15){shared=false;history.replaceState(null,'',location.pathname+location.search);result=calculateResult(state.answers,PROJECTS);setView('result');}else{state.step=state.answers.findIndex((a,i)=>!validAnswer(QUESTIONS[i],a));setView('quiz');}};document.querySelector('#restart-home')?.addEventListener('click',restart);}
function renderQuestion(){
 const q=QUESTIONS[state.step],answer=state.answers[state.step];
 const selected=i=>q.multiple?Array.isArray(answer)&&answer.includes(i):answer===i;
 main.innerHTML=`<section class="step-shell fade-in" aria-labelledby="question-title"><div class="step-top"><span>Pregunta ${String(state.step+1).padStart(2,'0')} <span style="color:#84969d">/ 15</span></span><span>${state.step===14?'Tu momento':state.step<4?'Tu día a día':state.step<8?'Los planes que te tincan':state.step<11?'Los apoyos que sirven':'Tu forma de participar'}</span></div><div class="progress" role="progressbar" aria-label="Progreso del test" aria-valuemin="0" aria-valuemax="15" aria-valuenow="${state.step}">${QUESTIONS.map((_,i)=>`<span class="${i<state.step?'done':i===state.step?'now':''}"></span>`).join('')}</div><div class="question-intro">${icon(q.context?'bridge':'spark')}${q.multiple?'Puedes marcar más de una':'Elige la alternativa más cercana a ti'}</div><h1 class="question-title" id="question-title">${esc(q.title)}</h1><p class="question-hint" id="question-hint">${esc(q.hint)}</p><div class="options ${q.multiple?'multi':''}" role="group" aria-labelledby="question-title" aria-describedby="question-hint">${q.options.map((o,i)=>`<button class="option ${selected(i)?'selected':''}" data-answer="${i}" aria-pressed="${Boolean(selected(i))}"><span class="option-icon">${icon(o.icon)}</span><span>${esc(o.text)}</span><span class="radio" aria-hidden="true"></span></button>`).join('')}</div><div class="step-actions"><button class="back" id="previous">${icon('arrow')} ${state.step===0?'Inicio':'Anterior'}</button><button class="cta" id="next" ${validAnswer(q,answer)?'':'disabled'}>${state.step===14?'Ver mi resultado':'Siguiente'} ${icon('arrow')}</button></div><p class="micro">${q.context?'Tu contexto afina los proyectos; no define quién eres.':'No hay respuestas correctas. También vale no querer sumarse a todo.'}</p></section>`;
 main.querySelectorAll('[data-answer]').forEach(button=>button.onclick=()=>{
 const i=Number(button.dataset.answer);
 if(q.multiple){let choices=Array.isArray(state.answers[state.step])?[...state.answers[state.step]]:[];if(choices.includes(i))choices=choices.filter(x=>x!==i);else if(q.options[i].exclusive)choices=[i];else choices=[...choices.filter(x=>!q.options[x].exclusive),i];state.answers[state.step]=choices.sort((a,b)=>a-b);}
 else state.answers[state.step]=i;
 persist();main.querySelectorAll('[data-answer]').forEach(el=>{const value=state.answers[state.step],active=q.multiple?value.includes(Number(el.dataset.answer)):Number(el.dataset.answer)===value;el.classList.toggle('selected',active);el.setAttribute('aria-pressed',active);});document.querySelector('#next').disabled=!validAnswer(q,state.answers[state.step]);
 });
 document.querySelector('#previous').onclick=()=>{if(state.step===0)setView('home');else{state.step--;persist();render();focusMain();}};
 document.querySelector('#next').onclick=()=>{if(!validAnswer(q,state.answers[state.step]))return;if(state.step===14){shared=false;history.replaceState(null,'',location.pathname+location.search);result=calculateResult(state.answers,PROJECTS);persist();setView('result');}else{state.step++;persist();render();focusMain();}};
}
function tagsHTML(tags){return `<div class="tags">${tags.map(t=>`<span class="tag" style="background:${TAG_META[t][1]}">${TAG_META[t][0]} ${esc(t)}</span>`).join('')}</div>`;}
function projectCard(p,index,withReason){let excerpt=p.description.split('\n\n')[0];if(excerpt.length>180)excerpt=excerpt.slice(0,177).replace(/\s+\S*$/,'')+'…';return `<article class="project-card"><div class="project-top"><span class="project-number">PROYECTO ${String(p.id).padStart(2,'0')}</span>${withReason?`<span class="match-pill">${p.signalScore<=0&&!p.contextMatch?'Para explorar':index===0?'Tu primer match':'Para ti'}</span>`:''}</div><h3>${esc(p.title)}</h3>${tagsHTML(p.tags)}<p class="project-excerpt">${esc(excerpt)}</p>${withReason?`<div class="why"><b>${p.signalScore<=0&&!p.contextMatch?'Una idea para descubrir':'Por qué aparece para ti'}</b>${esc(reasonFor(p,result))}</div>`:''}<button class="project-open" data-project="${p.id}">Conocer el proyecto ${icon('arrow')}</button></article>`;}
function bindProjects(){main.querySelectorAll('[data-project]').forEach(b=>b.onclick=()=>openProject(Number(b.dataset.project)));}
function renderResult(){if(!result){setView('home');return;}const p=PROFILES[result.primary]||FALLBACK_PROFILE,s=result.secondary===null?null:PROFILES[result.secondary],top=result.recommended;main.innerHTML=`${shared?'<div class="shared-note">Estás viendo un resultado compartido. <button class="text-button" id="my-test">Hacer mi propio test</button></div>':''}<section class="result-hero fade-in" aria-labelledby="result-title"><div><div class="eyebrow">${shared?'Una forma de vivir Derecho':'Tu forma de vivir Derecho'}</div><h1 id="result-title">${esc(p.name)}</h1><p class="lead">${esc(p.title)}</p><p class="description">${esc(p.text)}</p>${s?`<section class="secondary-profile" aria-labelledby="secondary-title"><div class="secondary-heading">${icon(s.icon)}<h2 id="secondary-title">También tienes algo de <strong>${esc(s.name.toLowerCase())}</strong></h2></div><p class="secondary-description">${esc(s.text)}</p></section>`:''}<div class="result-tools"><button class="cta yellow" id="share">${icon('share')} Compartir</button><button class="cta secondary" id="download">Guardar tarjeta ${icon('arrow')}</button></div></div><div class="result-icon" style="background:${p.color}">${icon(p.icon)}</div></section>${result.highlights.length?`<section class="result-highlights" aria-label="Intereses y apoyos que elegiste"><p>En tus respuestas también destacan</p><div>${result.highlights.map(label=>`<span>${esc(label)}</span>`).join('')}</div></section>`:''}${result.contexts.length?`<p class="context-summary">También consideramos ${result.contexts.map(c=>esc(CONTEXT_NAMES[c])).join(' y ')}.</p>`:''}<div class="section-heading"><div><h2>${result.primary===null?'Propuestas para explorar.':'Tus proyectos para descubrir.'}</h2><p>Según las actividades, apoyos y formas de participar que elegiste.</p></div><span class="count-pill">5 / 75</span></div><div class="project-grid">${top.map((p,i)=>projectCard(p,i,true)).join('')}</div><details class="profile-breakdown"><summary>Tu mezcla de intereses</summary><p class="micro" style="text-align:left;margin-top:10px">Afinidad orientativa según tus respuestas; las barras no son porcentajes de personalidad.</p>${result.axes.map(a=>`<div class="bar-row"><span class="bar-label">${esc(PROFILES[a.index].short)}</span><div class="bar-track" role="meter" aria-label="Afinidad con ${esc(PROFILES[a.index].short)}" aria-valuenow="${a.raw}" aria-valuemin="0" aria-valuemax="${a.max}"><div class="bar-fill" style="width:${Math.round(a.value*100)}%;background:${PROFILES[a.index].color}"></div></div></div>`).join('')}</details><div class="explore-banner"><div><h2>Tu perfil es solo el comienzo.</h2><p>Hay 75 maneras de hacer cosas JUNTOS. Explora el programa completo y encuentra otras que también te hagan sentido.</p></div><button class="cta" id="explore">Ver los 75 proyectos ${icon('arrow')}</button></div><div style="display:flex;justify-content:space-between;gap:15px;margin-top:20px">${!shared?'<button class="text-button" id="edit">Revisar mis respuestas</button>':''}<button class="text-button" id="restart">Hacer el test de nuevo</button></div><p class="bottom-note">Este es un test lúdico de intereses, no una evaluación psicológica. Las recomendaciones distinguen tus intereses, necesidades y contexto. El perfil es una síntesis lúdica, no una medida de personalidad.</p>`;
bindProjects();document.querySelector('#share').onclick=shareResult;document.querySelector('#download').onclick=()=>saveCard();document.querySelector('#explore').onclick=()=>{lastView='result';setView('library');};document.querySelector('#restart').onclick=restart;document.querySelector('#edit')?.addEventListener('click',()=>{state.step=0;setView('quiz');});document.querySelector('#my-test')?.addEventListener('click',restart);}
function renderLibrary(){const tags=Object.keys(TAG_META).filter(t=>PROJECTS.some(p=>p.tags.includes(t))).sort((a,b)=>a.localeCompare(b,'es'));main.innerHTML=`<section class="fade-in"><div class="eyebrow">El programa de JUNTOS</div><h1 class="page-title">75 proyectos.<br>Muchas formas de ser parte.</h1><p class="page-intro">Explora todas las propuestas, busca una idea o filtra por lo que te interesa.</p><div class="toolbar"><label class="search-wrap"><span class="sr-only">Buscar proyectos por nombre o palabras</span>${icon('search')}<input type="search" id="search" placeholder="Busca un proyecto, una idea…" value="${esc(librarySearch)}"></label><label><span class="sr-only">Filtrar por etiqueta</span><select id="tag-filter"><option value="">Todas las etiquetas</option>${tags.map(t=>`<option value="${esc(t)}" ${t===libraryTag?'selected':''}>${TAG_META[t][0]} ${esc(t)}</option>`).join('')}</select></label></div><p id="library-count" class="library-count" role="status"></p><div class="project-grid" id="library-grid"></div><p class="bottom-note">Textos y etiquetas del Programa JUNTOS · CADe Derecho UC · 75 proyectos. <a href="programa-juntos.pdf" download>Descargar programa en PDF</a>.</p></section>`;document.querySelector('#search').oninput=e=>{librarySearch=e.target.value;updateLibrary();};document.querySelector('#tag-filter').onchange=e=>{libraryTag=e.target.value;updateLibrary();};updateLibrary();}
function norm(s){return s.toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g,'');}
function updateLibrary(){const query=norm(librarySearch).trim().split(/\s+/).filter(Boolean);const list=PROJECTS.filter(p=>(!libraryTag||p.tags.includes(libraryTag))&&query.every(word=>norm(`${p.title} ${p.description} ${p.tags.join(' ')}`).includes(word)));document.querySelector('#library-count').textContent=`${list.length} de 75 proyectos${libraryTag?' · '+libraryTag:''}`;document.querySelector('#library-grid').innerHTML=list.length?list.map((p,i)=>projectCard(p,i,false)).join(''):'<div class="empty"><h3>No encontramos proyectos.</h3><p>Prueba con otra palabra o etiqueta.</p><button class="text-button" id="clear-filter">Limpiar búsqueda y filtros</button></div>';document.querySelector('#clear-filter')?.addEventListener('click',()=>{librarySearch='';libraryTag='';renderLibrary();document.querySelector('#search').focus();});bindProjects();}
function openProject(id){const p=PROJECTS.find(p=>p.id===id);document.querySelector('#dialog-content').innerHTML=`<div class="dialog-head"><span class="eyebrow">Proyecto ${String(p.id).padStart(2,'0')} / 75</span><button class="close-dialog" aria-label="Cerrar proyecto">×</button></div><h2 id="dialog-title">${esc(p.title)}</h2>${tagsHTML(p.tags)}<p class="full-description">${esc(p.description)}</p><p class="source-note">Propuesta del Programa JUNTOS · CADe Derecho UC. Texto completo del proyecto.</p>`;document.querySelector('.close-dialog').onclick=()=>dialog.close();dialog.showModal();}
dialog.onclick=e=>{if(e.target===dialog){const r=dialog.getBoundingClientRect();if(e.clientX<r.left||e.clientX>r.right||e.clientY<r.top||e.clientY>r.bottom)dialog.close();}};
function restart(){shared=false;result=null;state={view:'quiz',step:0,answers:Array(15).fill(null)};history.replaceState(null,'',location.pathname+location.search);persist();render();focusMain();}
function resultURL(){if(location.protocol==='file:')return '';return `${location.origin}${location.pathname}${location.search}#${encodeAnswers(shared?sharedAnswers:state.answers)}`;}
let sharedAnswers=null;
async function shareResult(){const p=PROFILES[result.primary]||FALLBACK_PROFILE,url=resultURL(),text=`Mi forma de vivir Derecho: ${p.name}. Descubre tu perfil y tus proyectos de JUNTOS.`;if(navigator.share){try{await navigator.share({title:'Tu forma de vivir Derecho · JUNTOS',text,...(url?{url}:{})});return;}catch(error){if(error.name==='AbortError')return;}}if(url){try{await navigator.clipboard.writeText(url);toast('Enlace del resultado copiado. ¡Compártelo!');return;}catch{}}await saveCard();}
function drawWrapped(ctx,text,x,y,width,lineHeight){const words=text.split(' ');let line='';for(const word of words){const test=line?line+' '+word:word;if(ctx.measureText(test).width>width&&line){ctx.fillText(line,x,y);y+=lineHeight;line=word;}else line=test;}if(line)ctx.fillText(line,x,y);return y+lineHeight;}
async function cardBlob(){
 const canvas=document.createElement('canvas');canvas.width=1080;canvas.height=1920;const c=canvas.getContext('2d'),p=PROFILES[result.primary]||FALLBACK_PROFILE,s=result.secondary===null?null:PROFILES[result.secondary];
 c.fillStyle='#0077B2';c.fillRect(0,0,1080,1920);c.fillStyle='#FFD525';c.fillRect(0,0,1080,20);c.font='900 85px Trebuchet MS, sans-serif';c.fillText('juntos!',78,132);c.fillStyle='#FFFFFF';c.font='bold 25px Trebuchet MS, sans-serif';c.fillText('CADe · DERECHO UC',78,179);c.font='bold 27px Trebuchet MS, sans-serif';c.fillText('MI FORMA DE VIVIR DERECHO',78,290);c.fillStyle=p.color;c.beginPath();c.arc(913,285,50,0,2*Math.PI);c.fill();
 c.fillStyle='#FFFFFF';c.font='900 86px Trebuchet MS, sans-serif';let y=drawWrapped(c,p.name,78,407,900,98);c.fillStyle='#FFF2AB';c.font='bold 35px Trebuchet MS, sans-serif';y=drawWrapped(c,p.title,78,y+27,900,47);c.fillStyle='#FFFFFF';c.font='29px Trebuchet MS, sans-serif';y=drawWrapped(c,p.text,78,y+24,900,41);
 if(s){c.font='bold 27px Trebuchet MS, sans-serif';y=drawWrapped(c,'También tengo algo de '+s.name.toLowerCase(),78,y+30,900,38);c.font='26px Trebuchet MS, sans-serif';y=drawWrapped(c,s.text,78,y+12,900,35);}
 if(result.highlights.length){c.fillStyle='#FFF2AB';c.font='bold 25px Trebuchet MS, sans-serif';y=drawWrapped(c,result.highlights.join(' · '),78,y+28,900,35);}
 const divider=Math.max(1170,y+35);c.fillStyle='#FFD525';c.fillRect(78,divider,924,3);c.fillStyle='#FFFFFF';c.font='bold 26px Trebuchet MS, sans-serif';c.fillText('MIS PROYECTOS PARA DESCUBRIR',78,divider+60);c.font='30px Trebuchet MS, sans-serif';let py=divider+115;result.recommended.slice(0,3).forEach((project,i)=>{py=drawWrapped(c,`${i+1}. ${project.title}`,78,py,900,39)+8;});
 c.fillStyle='#FFD525';c.font='bold 29px Trebuchet MS, sans-serif';c.fillText('¿Y tú? Descubre tu perfil.',78,1820);c.fillStyle='#FFFFFF';c.font='24px Trebuchet MS, sans-serif';c.fillText('@juntos.cade',78,1865);return new Promise(resolve=>canvas.toBlob(resolve,'image/png'));
}
async function saveCard(){try{const blob=await cardBlob();if(!blob)throw new Error();const file=new File([blob],'mi-perfil-juntos.png',{type:'image/png'});if(navigator.canShare?.({files:[file]})&&navigator.share){try{await navigator.share({files:[file],title:'Mi perfil JUNTOS'});return;}catch(e){if(e.name==='AbortError')return;}}const url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download='mi-perfil-juntos.png';a.click();setTimeout(()=>URL.revokeObjectURL(url),10000);toast('Tu tarjeta está lista. Revisa tus descargas.');}catch{toast('No pudimos guardar la tarjeta. Puedes hacer una captura de tu resultado.');}}
document.querySelector('#home-button').onclick=()=>setView('home');document.querySelector('#nav-program').onclick=()=>{if(state.view==='library'){setView(lastView==='result'&&result?'result':'home');}else{lastView=state.view==='result'?'result':'home';setView('library');}};
function openSharedHash(){if(!new URLSearchParams(location.hash.slice(1)).has('r'))return false;try{sharedAnswers=decodeAnswers(location.hash);result=calculateResult(sharedAnswers,PROJECTS);shared=true;state.view='result';return true;}catch(error){toast(error.message+' Puedes hacer tu propio test.');return false;}}
window.addEventListener('hashchange',()=>{if(openSharedHash()){render();focusMain();}});
openSharedHash();
render();

</script>
</body></html>
