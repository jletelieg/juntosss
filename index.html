const PROJECTS=[{"id": "cade-1", "number": 1, "source": "cade", "title": "Calendario de la Acción", "tags": ["servicio"], "description": "Todo el impacto social en un solo lugar. Un calendario mensual único con las fechas, horarios y salidas de todos los proyectos sociales. El CADe se encarga de visibilizarlos; tú eliges dónde quieres aportar.", "section": "Programa CADe", "features": {"volunteering": 1, "information": 0.5}, "joint": false, "canonical": "cade-1"}, {"id": "cade-2", "number": 2, "source": "cade", "title": "Shark Tank Derecho UC", "tags": ["servicio"], "description": "¿Tienes una idea para ayudar, pero te faltan financiamiento, apoyo y herramientas? Ven con tu propuesta, preséntanos tu proyecto y el CADe te ayudará a llevarlo a la práctica. Para que nunca más queden buenas ideas en el tintero", "section": "Programa CADe", "features": {"participation": 1, "volunteering": 0.6}, "joint": false, "canonical": "cade-2"}, {"id": "cade-3", "number": 3, "source": "cade", "title": "Feria de Proyectos Sociales", "tags": ["servicio"], "description": "Una vez por semestre, el patio de la Facultad se convertirá en una exposición de proyectos sociales. Invitaremos a iniciativas de la UC y de organizaciones externas a mostrar su trabajo, sumar voluntarios y conectar con estudiantes que quieran aportar. El CADe apoyará su difusión y abrirá un espacio para que nuestra comunidad conozca y se involucre en causas que mejoran la vida de otros.", "section": "Programa CADe", "features": {"volunteering": 1, "community": 0.3}, "joint": false, "canonical": "cade-3"}, {"id": "cade-4", "number": 4, "source": "cade", "title": "TuFuturo.CADe", "tags": ["servicio"], "description": "Junto a otras facultades y una municipalidad de escasos recursos, organizaremos una feria vocacional para que estudiantes de enseñanza media conozcan las carreras y los caminos que tienen por delante. Abrir la universidad a quienes la ven lejos.", "section": "Programa CADe", "features": {"school": 1, "volunteering": 0.3}, "joint": false, "canonical": "cade-4"}, {"id": "cade-5", "number": 5, "source": "cade", "title": "Generaciones Juntas", "tags": ["servicio"], "description": "Visitas a hogares de adultos mayores para acompañarlos y ver si tienen alguna necesidad concreta en la que podamos ayudar.", "section": "Programa CADe", "features": {"older": 1, "volunteering": 0.3}, "joint": false, "canonical": "cade-5"}, {"id": "cade-6", "number": 6, "source": "cade", "title": "CADe en Emergencia", "tags": ["servicio"], "description": "Cuando Chile se ve golpeado por una catástrofe, Derecho UC responde. Crearemos un protocolo para que el CADe tome la iniciativa y movilice voluntarios, con un equipo permanente preparado para activarse ante cada emergencia.", "section": "Programa CADe", "features": {"emergency": 1, "volunteering": 0.4}, "joint": false, "canonical": "cade-6"}, {"id": "cade-7", "number": 7, "source": "cade", "title": "Carretea Seguro", "tags": ["discriminación", "seguridad"], "description": "Un carrete es seguro cuando todos pueden disfrutarlo. Incorporaremos a la capacitación general de los OA’s un módulo específico para saber cómo actuar frente al acoso y los discursos de odio contra compañeros de la comunidad, ya sea por su orientación sexual, religión, nacionalidad o sexo: cómo intervenir, cómo acompañar y a quién derivar, con fiscalización y un compromiso explícito de cada OA. Que nadie tenga que cuidarse solo.", "section": "Programa CADe", "features": {"safety": 1, "inclusion": 1, "firstaid": 0.3}, "joint": false, "canonical": "cade-7"}, {"id": "cade-8", "number": 8, "source": "cade", "title": "Derecho sin Discriminación", "tags": ["discriminación"], "description": "El Derecho avanza con la sociedad, y nuestra formación también tiene que hacerlo. Organizaremos junto a la Consejería un ciclo de charlas sobre las leyes que han marcado avances contra la discriminación, ya sea por su orientación sexual, por su origen o por su sexo, y sobre cómo funcionan cuando hay que aplicarlas: Ley N° 20.609 (Ley Zamudio): cómo opera la acción contra la discriminación arbitraria. Ley N° 21.400 (matrimonio igualitario): sus efectos en filiación, incluida la doble filiación, con una mirada a la experiencia comparada. Ley N° 21.643 (Ley Karin): su aplicación frente a la discriminación laboral, qué se puede mejorar y cómo se implementan los protocolos de prevención y los reglamentos internos de orden, higiene y seguridad, en el sector público y en empresas.", "section": "Programa CADe", "features": {"inclusion": 1, "dialogue": 0.4}, "joint": true, "canonical": "discriminacion"}, {"id": "cade-9", "number": 9, "source": "cade", "title": "Catastro de Bienestar", "tags": ["discriminación", "bienestar"], "description": "Aplicaremos un catastro riguroso para poder estudiar de manera real cómo se sienten nuestros compañeros de la comunidad LGBTQ+ en la Facultad, las situaciones de discriminación que pueden haber vivido en la carrera, entre otros elementos. El objetivo de este proyecto es poder tener claridad de situaciones de discriminación que muchas veces se quedan en la experiencia personal y no permiten trabajar sobre ellas para presentar propuestas y soluciones concretas a la Facultad, además de visibilizar estas situaciones.", "section": "Programa CADe", "features": {"inclusion": 1, "mental": 0.35}, "joint": false, "canonical": "cade-9"}, {"id": "cade-10", "number": 10, "source": "cade", "title": "Mesa Antidiscriminación", "tags": ["discriminación"], "description": "Ninguna denuncia debería quedar sin respuesta. Instalaremos mesas de trabajo para elaborar protocolos claros frente a casos de discriminación, ya sea por orientación sexual, religión, nacionalidad o sexo.", "section": "Programa CADe", "features": {"inclusion": 1, "participation": 0.4}, "joint": false, "canonical": "cade-10"}, {"id": "cade-11", "number": 11, "source": "cade", "title": "Eight CADe", "tags": ["arte y cultura"], "description": "Las batallas de rap son de lo más esperado de la SSA, y no queremos que se queden ahí. Llevaremos una competencia de freestyle al patio de Derecho para que ese espíritu se viva más de una vez al año. Micrófono abierto.", "section": "Programa CADe", "features": {"rap": 1, "art": 0.2}, "joint": false, "canonical": "cade-11"}, {"id": "cade-12", "number": 12, "source": "cade", "title": "La Vuelta al CADe en 80 Días", "tags": ["arte y cultura"], "description": "Estudiamos en uno de los barrios más emblemáticos de Santiago y debemos aprovecharlo. Organizaremos salidas al casco histórico y a los lugares culturales que rodean Casa Central, en fechas que no choquen con el calendario académico. Pensadas especialmente para nuestros compañeros de región y novatos, para que conozcan el barrio donde estudiarán sus próximos años.", "section": "Programa CADe", "features": {"city": 1}, "joint": false, "canonical": "cade-12"}, {"id": "cade-13", "number": 13, "source": "cade", "title": "CADetouille", "tags": ["arte y cultura", "comunidad"], "description": "CADetouille es un ciclo de talleres gastronómicos donde aprenderemos a cocinar platos de distintas culturas: salir del estrés de las pruebas, ensuciarse las manos en equipo y terminar todos en una gran mesa. Para estar verdaderamente JUNTOS!", "section": "Programa CADe", "features": {"cooking": 1, "community": 0.5}, "joint": false, "canonical": "cade-13"}, {"id": "cade-14", "number": 14, "source": "cade", "title": "Fiebre de CADe", "tags": ["arte y cultura"], "description": "Haremos una ronda de Tiny Desk en la salita del CADe en la que un jurado elegirá a los dos mejores. Con ellos realizaremos una tocata solidaria en un bar que será a beneficio de algún proyecto de nuestra facultad. El que reciba más cariño del público, podrá grabar una canción a elección en un estudio.", "section": "Programa CADe", "features": {"music": 1, "volunteering": 0.3}, "joint": false, "canonical": "cade-14"}, {"id": "cade-15", "number": 15, "source": "cade", "title": "El CADe de Da Vinci", "tags": ["arte y cultura", "salud mental"], "description": "El break en el patio puede ser más que un café y una simple conversación. Instalaremos un gran lienzo en blanco para que cualquiera tome un pincel y se olvide, aunque sea por cinco minutos, de sus solemnes y exámenes.", "section": "Programa CADe", "features": {"art": 1, "rest": 0.4}, "joint": false, "canonical": "cade-15"}, {"id": "cade-16", "number": 16, "source": "cade", "title": "El CADe Viste de Prada", "tags": ["arte y cultura", "medioambiente"], "description": "Una gran feria de intercambio: traes la ropa que ya no usas. La cambias por fichas y te llevas otras prendas. Todos están invitados: estudiantes, profesores y funcionarios. Le daremos una segunda vida a nuestra ropa y aportaremos al cuidado del medio ambiente, todos JUNTOS.", "section": "Programa CADe", "features": {"environment": 1}, "joint": false, "canonical": "cade-16"}, {"id": "cade-17", "number": 17, "source": "cade", "title": "Dale otra página", "tags": ["arte y cultura"], "description": "Un proyecto para que los libros vuelvan a circular: intercambio de libros entre estudiantes,     recomendaciones     de lecturas entretenidas y una pequeña biblioteca abierta en la sala del CADe para intercambiar libros durante el año. Lleva uno, deja otro.", "section": "Programa CADe", "features": {"books": 1, "film": 0.2, "environment": 0.3}, "joint": true, "canonical": "libros"}, {"id": "cade-18", "number": 18, "source": "cade", "title": "Club de Cine", "tags": ["arte y cultura"], "description": "Iremos juntos a ver una película al Cine UC, con cabritas incluidas, y después nos reuniremos en la oficina del CADe para comentarla.", "section": "Programa CADe", "features": {"film": 1}, "joint": false, "canonical": "cade-18"}, {"id": "cade-19", "number": 19, "source": "cade", "title": "¡Nos Auxiliamos Juntos!", "tags": ["salud mental"], "description": "Cuidar a otros también se aprende. Abriremos una capacitación en primeros auxilios psicológicos a toda la comunidad: herramientas concretas y tips para saber qué hacer cuando un amigo o compañero lo está pasando mal. Esta capacitación ya existe para los representantes, pero creemos que es fundamental extenderla a todos.", "section": "Programa CADe", "features": {"firstaid": 1, "mental": 0.5}, "joint": false, "canonical": "cade-19"}, {"id": "cade-20", "number": 20, "source": "cade", "title": "A Un Click", "tags": ["salud mental"], "description": "Pedir ayuda no debería ser un trámite. Articularemos con Salud UC para facilitar el acceso a atención psicológica, psiquiátrica y el número 5.000. Crearemos una página que reúna todos los servicios disponibles y explique paso a paso cómo usarlos: dónde pedir hora, a quién acudir y qué esperar. Menos trámites y más rapidez.", "section": "Programa CADe", "features": {"mental": 1, "information": 0.4}, "joint": false, "canonical": "cade-20"}, {"id": "cade-21", "number": 21, "source": "cade", "title": "Está Bien No Estar Bien", "tags": ["salud mental"], "description": "Semana de concientización sobre salud mental, enfocada en las situaciones menos visibilizadas dentro de la Facultad. Contempla hitos comunicacionales, charlas y videos con profesionales invitados que muestren las soluciones existentes y transmitan la seriedad del tema. Se suman cápsulas en que profesores de la Facultad entregan recomendaciones prácticas de autocuidado, manejo del estrés académico y búsqueda de ayuda, para acercar el tema y validarlo desde la propia comunidad académica.", "section": "Programa CADe", "features": {"mental": 0.7, "prevention": 0.6}, "joint": false, "canonical": "cade-21"}, {"id": "cade-22", "number": 22, "source": "cade", "title": "La Suma de las Cosas Pequeñas", "tags": ["salud mental"], "description": "La salud mental de los estudiantes suele verse afectada por la suma de muchas cosas pequeñas, por lo que requiere un abordaje integral y sostenido en el tiempo. Este proyecto propone un diagnóstico y catastro serios sobre la situación de salud mental en la Facultad, que de verdad sirvan como base para tomar medidas y no queden en un trámite. Con estos resultados se sostendrá una reunión con la DAE para coordinar respuestas institucionales, se fortalecerá la consejería y se elaborará un plan estratégico de mediano plazo, con responsables y seguimiento.", "section": "Programa CADe", "features": {"mental": 1, "participation": 0.35}, "joint": false, "canonical": "cade-22"}, {"id": "cade-23", "number": 23, "source": "cade", "title": "CADe RUN", "tags": ["salud física", "deporte"], "description": "Zapatillas puestas y a correr JUNTOS. Una corrida abierta a toda la Facultad, estudiantes, profesores y funcionarios, para combatir el sedentarismo y despejar la mente.", "section": "Programa CADe", "features": {"sport": 1, "community": 0.25}, "joint": false, "canonical": "cade-23"}, {"id": "cade-24", "number": 24, "source": "cade", "title": "Sin Receta No", "tags": ["salud física", "salud mental"], "description": "Campaña        para     desnormalizar      la automedicación y el consumo de fármacos sin prescripción, especialmente en épocas de alta carga académica, informando sus riesgos y las alternativas disponibles. El enfoque es preventivo y de cuidado: proteger y orientar, no instalar una lógica de vigilancia entre pares.", "section": "Programa CADe", "features": {"prevention": 1}, "joint": false, "canonical": "cade-24"}, {"id": "cade-25", "number": 25, "source": "cade", "title": "La Búsqueda del Deporte", "tags": ["salud física", "deporte"], "description": "Gestionaremos convenios con gimnasios cercanos para que entrenar sea más accesible para los estudiantes. Como sabemos lo difícil que es gestionar estos convenios para los cerca de 1.800 alumnos de Derecho, buscaremos instalar una mesa de trabajo en conjunto con las demás facultades de Casa Central, para hacer más efectiva la discusión de esta materia.", "section": "Programa CADe", "features": {"sport": 1, "financial": 0.25}, "joint": false, "canonical": "cade-25"}, {"id": "cade-26", "number": 26, "source": "cade", "title": "Juntos Nos Desconectamos", "tags": ["salud mental", "comunidad"], "description": "Durante las semanas de solemnes y exámenes, todos los miércoles llevaremos al patio café, snacks, música y juegos rápidos para ofrecer a los estudiantes un momento de descanso en medio de la carga académica. La idea es crear un espacio breve y de libre acceso, al que se pueda llegar entre estudio y estudio, para despejarse, compartir con otros y volver a estudiar con mejor ánimo. Parte de la convicción de que el descanso no es una pérdida de tiempo, sino una condición para rendir bien.", "section": "Programa CADe", "features": {"rest": 1, "community": 0.4}, "joint": false, "canonical": "cade-26"}, {"id": "cade-27", "number": 27, "source": "cade", "title": "Cada Segundo Cuenta", "tags": ["salud física"], "description": "Taller práctico de RCP abierto a toda la comunidad de la Facultad, realizado en el patio para hacerlo visible, accesible y de participación espontánea. Estará a cargo de instructores capacitados y enseñará a reconocer un paro cardiorrespiratorio, activar la cadena de emergencia, realizar compresiones torácicas y usar un desfibrilador externo automático (DEA), con práctica en maniquíes.", "section": "Programa CADe", "features": {"firstaid": 1, "emergency": 0.2}, "joint": false, "canonical": "cade-27"}, {"id": "cade-28", "number": 28, "source": "cade", "title": "¡Conversemos Juntos!", "tags": ["compromiso país"], "description": "Como queremos una comunidad informada y activa respecto a temas de contingencia nacional, prepararemos un plan de dos etapas para generar instancias de diálogo y conversación. Partiremos con la charla de un experto en un tema relevante de la contingencia nacional y luego abriremos un espacio de diálogo tipo cabildo abierto, con preguntas guiadas y en un círculo completamente horizontal, para analizar lo que pasa en Chile y el mundo. Sin tarimas y con respeto.", "section": "Programa CADe", "features": {"dialogue": 1, "expression": 0.4}, "joint": false, "canonical": "cade-28"}, {"id": "cade-29", "number": 29, "source": "cade", "title": "Choque de Titanes 2.0", "tags": ["compromiso país"], "description": "Traeremos a los profesores y expositores más destacados a debatir frente a frente en el patio sobre lo que está ocurriendo a nivel país. Es importante informarnos y formar opinión sobre la contingencia nacional.", "section": "Programa CADe", "features": {"dialogue": 1, "expression": 0.2}, "joint": false, "canonical": "cade-29"}, {"id": "cade-30", "number": 30, "source": "cade", "title": "Un Día en Valparaíso", "tags": ["compromiso país"], "description": "El Congreso no se entiende igual desde la sala de clases. Organizaremos una visita para presenciar sesiones de comisión, preparadas con una ficha del proyecto que se discute ese día y seguidas de una conversación con asesores legislativos. Ver cómo se hace una ley cambia la forma de estudiarla.", "section": "Programa CADe", "features": {"legislation": 1}, "joint": false, "canonical": "cade-30"}, {"id": "cade-31", "number": 31, "source": "cade", "title": "Tu Columna", "tags": ["compromiso país"], "description": "Las ideas de los estudiantes de Derecho merecen llegar más allá de la sala. Daremos un espacio permanente para publicar columnas de estudiantes de todas las sensibilidades sobre la contingencia nacional y los impulsaremos a enviarlas a los diarios nacionales.", "section": "Programa CADe", "features": {"expression": 1, "dialogue": 0.5}, "joint": false, "canonical": "cade-31"}, {"id": "cade-32", "number": 32, "source": "cade", "title": "Del Aula al Servicio Público", "tags": ["compromiso país"], "description": "Muchos egresados de la Facultad han servido al país desde ministerios, el Congreso, tribunales y municipios, en distintos gobiernos. Los invitaremos a contar cómo es trabajar en lo público: qué se aprende, qué cuesta y por qué vale la pena. Queremos que la vocación de servicio sea una opción real para cada estudiante.", "section": "Programa CADe", "features": {"publicservice": 1, "dialogue": 0.3}, "joint": false, "canonical": "cade-32"}, {"id": "cade-33", "number": 33, "source": "cade", "title": "La Iglesia y los Derechos Humanos", "tags": ["compromiso país", "memoria"], "description": "Entre 1973 y 1990, la Iglesia chilena impulsó el Comité Pro Paz y la Vicaría de la Solidaridad, donde muchos abogados defendieron a las personas sin distinción. Como comunidad de la Universidad Católica, revisaremos esa historia, su trabajo jurídico y el legado de quienes lo hicieron posible, con visitas a su archivo y conversaciones con quienes participaron.", "section": "Programa CADe", "features": {"memory": 1, "inclusion": 0.3}, "joint": false, "canonical": "cade-33"}, {"id": "cade-34", "number": 34, "source": "cade", "title": "Ingeniería de la Transición", "tags": ["compromiso país", "memoria"], "description": "Chile volvió a la democracia por un camino jurídico. Analizaremos el plebiscito de 1988, la reforma constitucional de 1989 y los acuerdos de los primeros años, con invitados que nos cuenten cómo se llevó a cabo el proceso de transición.", "section": "Programa CADe", "features": {"memory": 1, "legislation": 0.4}, "joint": false, "canonical": "cade-34"}, {"id": "cade-35", "number": 35, "source": "cade", "title": "Mujeres en la Cárcel", "tags": ["feminismo", "servicio"], "description": "Una realidad que casi nadie mira. El proyecto tiene dos fases: una campaña masiva de recolección en el patio para armar kits de higiene (toallas higiénicas, jabón, shampoo) y jornadas de visita coordinadas con la Capellanía Carcelaria o fundaciones afines para ir a conocer a las reclusas, sus experiencias y acompañar. De esta manera, conocemos desde dentro las deficiencias del sistema penal.", "section": "Programa CADe", "features": {"prison": 1, "volunteering": 0.3}, "joint": false, "canonical": "cade-35"}, {"id": "cade-36", "number": 36, "source": "cade", "title": "La Caja Morada", "tags": ["feminismo"], "description": "Dentro del baño de nuestra Facultad existe una caja de insumos menstruales que, lamentablemente, suele estar vacía. Por eso, nos comprometemos a estar pendientes de su reposición, buscando que siempre cuente con los insumos necesarios para que cualquier mujer pueda acceder a ellos en caso de necesitarlos.", "section": "Programa CADe", "features": {"menstrual": 1}, "joint": false, "canonical": "cade-36"}, {"id": "cade-37", "number": 37, "source": "cade", "title": "Carta a Mi Yo de Primero", "tags": ["feminismo", "novatos"], "description": "Las alumnas de cursos superiores escriben una carta a las futuras estudiantes de Derecho: lo que les habría gustado saber, cómo enfrentar los prejuicios y qué consejos les darían. Las cartas se entregan al inicio del año siguiente, con el contacto de su autora, para que cada novata decida si quiere conocerla. Algo distinto a las madrinas.", "section": "Programa CADe", "features": {"mentoring": 1, "inclusion": 0.35}, "joint": false, "canonical": "cade-37"}, {"id": "cade-38", "number": 38, "source": "cade", "title": "¡Volvamos Juntas!", "tags": ["feminismo", "seguridad"], "description": "Una red de apoyo de alumnas de la Facultad, a través de un grupo de WhatsApp, para coordinarse y volver acompañadas después de clases, carretes o actividades, incluyendo traslados compartidos.", "section": "Programa CADe", "features": {"safety": 1, "community": 0.3}, "joint": false, "canonical": "cade-38"}, {"id": "cade-39", "number": 39, "source": "cade", "title": "¡8M JUNTAS!", "tags": ["feminismo"], "description": "Vivamos el Día de la Mujer todo el mes, con actividades que nos invitan a encontrarnos, reflexionar y actuar como comunidad. Planteamos 4 ejes, uno para abarcar cada semana: maternidad, vida laboral, violencia y derecho.", "section": "Programa CADe", "features": {"inclusion": 0.7, "menstrual": 0.3, "dialogue": 0.4}, "joint": false, "canonical": "cade-39"}, {"id": "cade-40", "number": 40, "source": "cade", "title": "Manual del Foráneo", "tags": ["regiones", "comunidad"], "description": "Convenios, descuentos, becas, etc. Todo lo que te habría gustado saber al llegar.", "section": "Programa CADe", "features": {"information": 1, "financial": 0.5}, "joint": false, "canonical": "cade-40"}, {"id": "cade-41", "number": 41, "source": "cade", "title": "Fin de Semana Juntos", "tags": ["regiones"], "description": "Cuando es viernes muchos vuelven con su familia, otros se quedan en Santiago. Organizaremos salidas a distintos lugares de la capital el fin de semana para que quienes se queden tengan con quién compartir y conocer la ciudad. Que nadie tenga que pasar solo los fines de semana.", "section": "Programa CADe", "features": {"community": 1, "city": 0.4}, "joint": false, "canonical": "cade-41"}, {"id": "cade-42", "number": 42, "source": "cade", "title": "Comer Bien Lejos de Casa", "tags": ["regiones", "salud física"], "description": "Comer bien no debería ser un lujo en época de solemnes. Buscaremos convenios con proveedores de comida casera y congelados, y compartiremos un menú de recetas sanas, rápidas y baratas, en coordinación con nuestros proyectos de salud.", "section": "Programa CADe", "features": {"food": 1, "financial": 0.3}, "joint": false, "canonical": "cade-42"}, {"id": "cade-43", "number": 43, "source": "cade", "title": "Comunidad de WhatsApp Foráneos", "tags": ["regiones", "comunicaciones"], "description": "Queremos que cada uno se sienta cómodo en su vida en la capital. Queremos comunicarnos con ustedes de forma más directa a través de distintos grupos como transporte, datos, panoramas, etc.", "section": "Programa CADe", "features": {"information": 1, "community": 0.5}, "joint": false, "canonical": "cade-43"}, {"id": "cade-44", "number": 44, "source": "cade", "title": "Comunidad de WhatsApp Oficial", "tags": ["comunicaciones", "comunidad"], "description": "Un canal donde solo escribe el CADe: actividades, eventos y votaciones, sin ruido. Para cuando Instagram queda olvidado en período de solemnes. Además, cada vocalía tendrá su propio canal: suscríbete solo a lo que te interesa.", "section": "Programa CADe", "features": {"information": 1}, "joint": false, "canonical": "cade-44"}, {"id": "cade-45", "number": 45, "source": "cade", "title": "Kit Novatos", "tags": ["novatos"], "description": "El primer día no llegas solo. Te esperamos en la facultad con un kit que tiene todo lo que necesitas: un mapa con las salas de Casa Central, tips útiles sobre tus profesores y el contacto de tus representantes. Así, desde el día uno, sabes que en Derecho UC siempre hay alguien a quien acudir.", "section": "Programa CADe", "features": {"information": 1, "mentoring": 0.5}, "joint": false, "canonical": "cade-45"}, {"id": "cade-46", "number": 46, "source": "cade", "title": "Almuerzo CADe + Paquetes", "tags": ["novatos", "comunidad"], "description": "Queremos conocerte de verdad. Como CADe almorzaremos en la oficina con cada paquete para escuchar qué te preocupa, qué te entusiasma y qué esperas de tu paso por Derecho UC. Tú pones las ganas de conversar y nosotros ponemos la mesa. Que ningún novato quede afuera.", "section": "Programa CADe", "features": {"community": 1, "mentoring": 0.5}, "joint": false, "canonical": "cade-46"}, {"id": "cade-47", "number": 47, "source": "cade", "title": "Lockers para Todos", "tags": ["infraestructura"], "description": "Hay muy pocos lockers y la demanda es mucha. Ordenaremos y fiscalizaremos su uso, y gestionaremos con la Facultad la instalación de más lockers para que todos tengan dónde guardar sus cosas.", "section": "Programa CADe", "features": {"storage": 1}, "joint": false, "canonical": "cade-47"}, {"id": "cade-48", "number": 48, "source": "cade", "title": "JUNTOS en los Patios", "tags": ["infraestructura", "comunidad"], "description": "El patio también se juega. Sumaremos a las mesas de ping-pong dos spikeballs, para que haya más actividades para realizar en cada momento del día en el patio. Puedes usarlo cuando quieras, no sólo en épocas de campaña.", "section": "Programa CADe", "features": {"community": 1, "rest": 0.4, "sport": 0.2}, "joint": false, "canonical": "cade-48"}, {"id": "cade-49", "number": 49, "source": "cade", "title": "Zorro No te lo Lleves", "tags": ["infraestructura"], "description": "Compraremos mesas plegables para que cuando haya actividades externas en el patio no se usen todas las mesas y todos tengan un lugar donde sentarse.", "section": "Programa CADe", "features": {"seating": 1}, "joint": false, "canonical": "cade-49"}, {"id": "cade-50", "number": 50, "source": "cade", "title": "Padrinos y Madrinas Todo el Año", "tags": ["novatos"], "description": "El sistema queda abierto durante todo el año, para que quien no consiguió madrina o padrino al inicio no pierda la oportunidad, con responsabilidades claras y seguimiento para que ningún ahijado quede botado a mitad de semestre.", "section": "Programa CADe", "features": {"mentoring": 1}, "joint": false, "canonical": "cade-50"}, {"id": "cade-51", "number": 51, "source": "cade", "title": "Institucionalización Padrino-Ahijado", "tags": ["novatos"], "description": "Queremos que el vínculo de los padrinos con sus ahijados no se quede solamente en su relación personal. Organizaremos un almuerzo entre tríos de padrinos para que los ahijados puedan conocerse entre sí y compartan sus experiencias durante sus primeros meses en la universidad.", "section": "Programa CADe", "features": {"mentoring": 0.8, "community": 0.6}, "joint": false, "canonical": "cade-51"}, {"id": "cade-52", "number": 52, "source": "cade", "title": "Paquetes Hermanos", "tags": ["novatos", "comunidad"], "description": "Muchos compartimos ramos, pero no nos conocemos realmente. Organizaremos encuentros entre paquetes para estudiar juntos y compartir apuntes. Una oportunidad para aprender mejor y, de paso, conocer a más compañeros de la generación.", "section": "Programa CADe", "features": {"community": 0.8, "mentoring": 0.5, "study": 0.4}, "joint": false, "canonical": "cade-52"}, {"id": "cade-53", "number": 53, "source": "cade", "title": "Pasaporte Derecho", "tags": ["comunidad"], "description": "Un pasaporte con actividades para conocer la facultad (asistir a un evento, conocer la Clínica, ir a tribunales, etc.), con un premio al completarlo. Convierte la integración en algo concreto y entretenido.", "section": "Programa CADe", "features": {"mentoring": 0.6, "city": 0.3, "community": 0.6}, "joint": false, "canonical": "cade-53"}, {"id": "cade-54", "number": 54, "source": "cade", "title": "Conozcámonos Juntos", "tags": ["comunidad"], "description": "Guardias, personal de aseo y administrativos: los vemos todos los días, pero pocas veces sabemos sus nombres. En cada cumpleaños publicaremos un post con su nombre, sus gustos y algún dato freak, para que todos los conozcamos mejor. Ellos también son parte de nuestra comunidad.", "section": "Programa CADe", "features": {"staff": 1, "community": 0.4}, "joint": false, "canonical": "cade-54"}, {"id": "cade-55", "number": 55, "source": "cade", "title": "Desayuno con Funcionarios", "tags": ["comunidad"], "description": "Un desayuno con funcionarios y trabajadores de la universidad, en un espacio más íntimo, para conocerlos y agradecerles todo lo que hacen por la Facultad.", "section": "Programa CADe", "features": {"staff": 1, "community": 0.5}, "joint": false, "canonical": "cade-55"}, {"id": "cade-56", "number": 56, "source": "cade", "title": "¡Carreteemos JUNTOS!", "tags": ["comunidad", "beneficios"], "description": "Haremos precios diferenciados en nuestros eventos para aquellos de nuestros compañeros que estudien gratuidad o con CAE además de nuestros cupos solidarios, porque queremos que todo sea juntos!", "section": "Programa CADe", "features": {"community": 1, "financial": 1}, "joint": false, "canonical": "cade-56"}, {"id": "cade-57", "number": 57, "source": "cade", "title": "Facultad sin Barreras", "tags": ["infraestructura", "inclusión"], "description": "Realizaremos, junto a estudiantes con discapacidad, un diagnóstico de las barreras físicas, académicas y digitales de la Facultad, como el acceso a la biblioteca destinada a personas con discapacidad. Presentaremos sus resultados a la Dirección y haremos seguimiento público de su corrección.", "section": "Programa CADe", "features": {"accessibility": 1}, "joint": true, "canonical": "barreras"}, {"id": "cade-58", "number": 58, "source": "cade", "title": "Compañero Tutor", "tags": ["inclusión", "novatos"], "description": "Todos los años el CADe realiza un programa para que los estudiantes de primer año tengan un tutor. Para nuestros compañeros de primer año que cuenten con alguna discapacidad los tutores recibirán una preparación previa mediante talleres especializados, para que puedan ejercer su rol con responsabilidad y conocimiento.", "section": "Programa CADe", "features": {"mentoring": 0.7, "accessibility": 1}, "joint": false, "canonical": "cade-58"}, {"id": "cade-59", "number": 59, "source": "cade", "title": "Guía Única de Recursos", "tags": ["inclusión", "beneficios"], "description": "Un documento, en formatos accesibles, que reúna todos los beneficios, servicios, contactos y procedimientos de la UC para estudiantes con discapacidad. Hoy esa información suele estar dispersa.", "section": "Programa CADe", "features": {"accessibility": 1, "information": 0.5}, "joint": false, "canonical": "cade-59"}, {"id": "cade-60", "number": 60, "source": "cade", "title": "Beca Intercampus", "tags": ["college"], "description": "Sabemos que muchos estudiantes de College todavía tienen ramos en San Joaquín, lo que los obliga a moverse entre campus y a gastar prácticamente el doble en traslados. Por eso, crearemos la Beca Intercampus: un apoyo mensual para cargar la TNE de los estudiantes de College que lo necesiten.", "section": "Programa CADe", "features": {"financial": 1}, "joint": false, "canonical": "cade-60"}, {"id": "cade-61", "number": 61, "source": "cade", "title": "Starter Pack College", "tags": ["college"], "description": "Una versión del Kit Novatos adaptada a quienes llegan desde College: la guía de continuidad, contactos, un mapa de Casa Central y los beneficios del CADe. Que conozcan la esencia de nuestra Facultad. Queremos formar la comunidad de derecho UC todos JUNTOS.", "section": "Programa CADe", "features": {"information": 1, "mentoring": 0.5}, "joint": false, "canonical": "cade-61"}, {"id": "cade-62", "number": 62, "source": "cade", "title": "Tutores x College", "tags": ["college"], "description": "Los compañeros de College que continúen sus estudios en Derecho y lo deseen podrán contar con un tutor: un estudiante de cursos superiores de la Facultad, idealmente alguien que también haya llegado por esta vía, que los acompañará en su llegada a la carrera y a Casa Central. Los tutores recibirán una preparación previa mediante talleres, para que puedan orientar con conocimiento en la malla, los trámites de continuidad y la vida de la Facultad.", "section": "Programa CADe", "features": {"mentoring": 1, "study": 0.4}, "joint": false, "canonical": "cade-62"}, {"id": "cade-63", "number": 63, "source": "cade", "title": "Poniéndote al Día", "tags": ["college"], "description": "Sabemos que muchos de nuestros compañeros de College llegan el segundo semestre y no tienen la oportunidad de conocer todas las iniciativas y proyectos que existen en nuestra facultad. Vamos a organizar un conversatorio para que todos puedan ponerse al día de lo que se han perdido hasta llegar a Derecho.", "section": "Programa CADe", "features": {"information": 0.7, "community": 0.5}, "joint": false, "canonical": "cade-63"}, {"id": "cade-64", "number": 64, "source": "cade", "title": "La Otra Cara: el Podcast de los Profes", "tags": ["comunidad"], "description": "La Otra Cara es nuestro podcast donde sentamos a los profesores fuera de la sala de clases para conocer su lado más humano: historias, fracasos, anécdotas universitarias y consejos reales, para escuchar camino a la Facultad.", "section": "Programa CADe", "features": {"professors": 1}, "joint": false, "canonical": "cade-64"}, {"id": "cade-65", "number": 65, "source": "cade", "title": "Mapa CADe", "tags": ["comunidad", "regiones"], "description": "Todo lo bueno alrededor de Casa Central, en un solo mapa. Lugares para hacer deporte, restaurantes, tiendas, centros culturales y panoramas del barrio, recomendados por los propios estudiantes. Para el novato que recién llega, para quien todavía no conoce bien Santiago y para cualquiera que quiera salir de la rutina.", "section": "Programa CADe", "features": {"city": 0.7, "information": 0.7}, "joint": false, "canonical": "cade-65"}, {"id": "cade-66", "number": 66, "source": "cade", "title": "Voluntariado Arriba la Comuna", "tags": ["servicio"], "description": "Un voluntariado junto a nuestros compañeros de Medicina e Ingeniería Comercial: un fin de semana iremos a una localidad a entregar orientación jurídica, un operativo de salud y clases de finanzas, además de apoyo escolar a niños en lenguaje, matemáticas, historia y ciencias, en la medida de lo posible.", "section": "Programa CADe", "features": {"legal": 1, "volunteering": 0.5}, "joint": false, "canonical": "cade-66"}, {"id": "cade-67", "number": 67, "source": "cade", "title": "Congreso Miremos Chile", "tags": ["compromiso país"], "description": "Un congreso que reunirá a personas relevantes en el debate público, alumnos universitarios y alumnos secundarios, con exposiciones e instancias de diálogo en torno al futuro del país y cómo construir desde el respeto a las instituciones y la democracia, el diálogo y la academia.", "section": "Programa CADe", "features": {"dialogue": 1, "publicservice": 0.5, "expression": 0.4}, "joint": false, "canonical": "cade-67"}, {"id": "cade-68", "number": 68, "source": "cade", "title": "Asociación de Músicos Universitarios Derecho UC", "tags": ["arte y cultura"], "description": "Crearemos un grupo para reunir, potenciar y articular a los músicos de Derecho UC: un espacio para reconocerse como comunidad, conocerse, conectar, crear proyectos y compartir información y experiencias.", "section": "Programa CADe", "features": {"music": 1, "community": 0.3}, "joint": false, "canonical": "cade-68"}, {"id": "cade-69", "number": 69, "source": "cade", "title": "Que Vuelva el Deporte en Casa Central", "tags": ["deporte", "infraestructura"], "description": "Queremos que hacer deporte sea una alternativa real dentro de la jornada universitaria, como un espacio de bienestar y una pausa frente a las exigencias de la carrera. Para ello, proponemos dos gestiones concretas: Camarines y resguardo de pertenencias: Identificaremos los camarines existentes en Casa Central y gestionaremos su acceso para estudiantes. Si no es posible utilizarlos, presentaremos una propuesta para habilitar un espacio donde cambiarse y guardar pertenencias, identificando los recintos disponibles, los costos y las autorizaciones necesarias. Mejoramiento del espacio polideportivo: Presentaremos a la universidad una propuesta de acondicionamiento que haga más cómodo y atractivo hacer ejercicio en el patio de Medicina. Esta incluirá la instalación de una carpa u otra solución que otorgue mayor privacidad, sujeta a las condiciones técnicas del espacio.", "section": "Programa CADe", "features": {"sport": 1, "storage": 0.3}, "joint": false, "canonical": "cade-69"}, {"id": "cade-70", "number": 70, "source": "cade", "title": "Reforma Vocalías", "tags": ["comunidad"], "description": "Las vocalías son los brazos con que el CADe levanta proyectos y trae las soluciones y oportunidades directamente a los alumnos. Son además un espacio clave en que los alumnos pueden involucrarse en liderar proyectos, trabajar en equipo y poder encontrar un espacio en la facultad donde ser protagonistas. Sin embargo, hoy las vocalías están muy separadas del CADe, siendo organismos que tienden a poner mucha presión sobre los Jefes de Vocalía que terminan quedando solos y a la deriva. Por esto proponemos una reforma que considere los siguientes ejes: Jefes de Vocalía son parte del CADe: Son una pieza fundamental en la labor del Centro de Alumnos, por lo que tendrán un rol mucho más presente en la orgánica del mismo. Las reuniones entre el CADe y los jefes serán más relevantes y periódicas. Equipo de vocalías: Incentivaremos que las vocalías tengan un equipo que considere comunicaciones, logística, financiamiento, entre otros. Las personas que forman parte de la vocalía son verdaderamente parte de un equipo en donde tienen una función específica.", "section": "Programa CADe", "features": {"participation": 1, "logistics": 1}, "joint": false, "canonical": "cade-70"}, {"id": "cade-71", "number": 71, "source": "cade", "title": "TNE Gradista", "tags": ["gradistas", "beneficios"], "description": "Cuando uno está estudiando el grado pierde el beneficio de la TNE. Esto, además de traer problemas económicos para los alumnos, genera una barrera para salir de la casa, estudiar en lugares distintos y moverse, lo cual es esencial para la salud mental durante este delicado período. Proponemos presentar a la Facultad esta necesidad tan relevante, para lograr levantar una solución y dar la calidad de alumno en vías de titulación durante los 8 primeros meses después de egresar, de manera de no perder esos beneficios.", "section": "Programa CADe", "features": {"financial": 1, "study": 0.4}, "joint": false, "canonical": "cade-71"}, {"id": "cade-72", "number": 72, "source": "cade", "title": "Créditos Gradistas", "tags": ["gradistas", "beneficios"], "description": "Sabemos que el problema de imprimir muchas páginas no es un problema que se queda en quinto año. Los gradistas tienen miles de páginas que estudiar y deben imprimirlas con su propio presupuesto. Gestionaremos con la facultad y la DAE la posibilidad de que los gradistas mantengan sus créditos en la CRISOL para que afrontar este período sea más ameno.", "section": "Programa CADe", "features": {"financial": 1, "study": 0.5}, "joint": false, "canonical": "cade-72"}, {"id": "cade-73", "number": 73, "source": "cade", "title": "Presupuesto Juntos", "tags": ["transparencia"], "description": "La plata del CADe es de todos, y todos deberían saber cómo se va a usar antes de que se gaste. A comienzos de año presentaremos un presupuesto anual con partidas claras: eventos, vocalías, proyectos sociales, funcionamiento y reserva, indicando cuánto se destinará a cada una y con qué objetivo. El presupuesto se presentará a los representantes de generación y se publicará para toda la Facultad. Si durante el año es necesario modificar una partida de manera importante, lo informaremos con su justificación. Al cierre, compararemos lo presupuestado con lo efectivamente gastado, para que cualquiera pueda evaluar si cumplimos.", "section": "Programa CADe", "features": {"annual_budget": 1, "budget": 0.7}, "joint": false, "canonical": "cade-73"}, {"id": "cade-74", "number": 74, "source": "cade", "title": "Lo Que Recibimos, lo Entregamos", "tags": ["transparencia"], "description": "Un centro de alumnos no debería heredar menos de lo que recibió el anterior. Nos comprometemos a dejar a la próxima directiva, como mínimo, el mismo saldo que recibiremos al asumir. Al comenzar, publicaremos el saldo que recibimos, conciliado con la cartola bancaria y descontando las deudas pendientes. Al terminar, publicaremos el saldo que entregamos, calculado de la misma forma. Así cada directiva responde por lo que recibió y por lo que deja, y la siguiente puede partir con la tranquilidad de tener recursos para trabajar desde el primer día.", "section": "Programa CADe", "features": {"continuity": 1, "budget": 0.3}, "joint": false, "canonical": "cade-74"}, {"id": "cade-75", "number": 75, "source": "cade", "title": "La Ruta de la Democracia", "tags": ["compromiso país", "memoria"], "description": "La Ruta de la Democracia invita a conocer la historia de Chile entre 1973 y 1990. Visitaremos el Museo de la Memoria y otros lugares relevantes de este período. Buscamos generar un espacio de aprendizaje y diálogo abierto y pluralista. Una oportunidad para reflexionar sobre los derechos humanos y el valor de la democracia.", "section": "Programa CADe", "features": {"memory": 1, "city": 0.5, "dialogue": 0.25}, "joint": false, "canonical": "cade-75"}, {"id": "cade-76", "number": 76, "source": "cade", "title": "Cada Evento con su Balance", "tags": ["transparencia"], "description": "Fiestas, carretes y eventos son donde más plata se mueve y donde más fácil es perderle el rastro. Por eso, después de cada evento publicaremos su balance: cuánto costó, cuánto se recaudó y cuál fue el resultado, con el detalle de los principales gastos e ingresos. Cuentas claras en cada evento para que, al final del año, las cuentas del CADe cuadren.", "section": "Programa CADe", "features": {"event_balance": 1, "budget": 0.7}, "joint": false, "canonical": "cade-76"}, {"id": "cade-77", "number": 77, "source": "cade", "title": "El Reciclaje También Suma", "tags": ["medioambiente", "comunidad"], "description": "La cantidad de papel que usamos cada semestre es increíble: páginas y páginas de apuntes que terminan en la basura después del periodo de exámenes. Queremos que esto deje de ser así. Por eso, incorporaremos a la Semana San Alfonso una prueba de reciclaje de apuntes, en la que la generación que logre reunir la mayor cantidad de apuntes efectivamente utilizados recibirá el puntaje correspondiente a una prueba de la SSA.", "section": "Programa CADe", "features": {"environment": 1, "books": 0.2, "community": 0.3}, "joint": false, "canonical": "cade-77"}, {"id": "cade-78", "number": 78, "source": "cade", "title": "ConCiencia Cívica", "tags": ["servicio"], "description": "Muchas veces, lo que aprendemos en la universidad parece lejano a la realidad, pero el Derecho está presente en nuestra vida cotidiana. Por eso, queremos llevar a cabo una iniciativa para que estudiantes de la Facultad puedan dictar clases de Educación Cívica en comunidades con menor acceso a esta información, creando espacios cercanos y dinámicos para conversar sobre temas relevantes para la vida en sociedad.", "section": "Programa CADe", "features": {"volunteering": 0.4, "legal": 0.5, "dialogue": 0.6, "civic_teaching": 1}, "joint": true, "canonical": "civica"}, {"id": "cade-79", "number": 79, "source": "cade", "title": "Pasantías con Sentido", "tags": ["compromiso país"], "description": "Buscamos generar convenios de pasantías con fundaciones, como Desafío Levantemos Chile o Fundación Las Rosas, para que los estudiantes de 3° a 5° puedan poner sus conocimientos al servicio de iniciativas con impacto social. El proyecto contempla una charla informativa para conocer las organizaciones, seguida de una instancia más dinámica para conocer sus áreas de trabajo, y un proceso de selección coordinado con cada institución.", "section": "Programa CADe", "features": {"volunteering": 0.5, "legal": 0.5, "social_internship": 1}, "joint": true, "canonical": "pasantias"}, {"id": "consejeria-1", "number": 1, "sectionNumber": 1, "source": "consejeria", "title": "Consejer-IA", "description": "Muchas veces, sobre todo en periodos de evaluaciones y toma de ramos, surgen dudas que requieren atención urgente. Para eso, crearemos un asistente virtual de WhatsApp que responderá automáticamente las dudas más frecuentes, tales como ¿Cuáles son las causales de rezago? ¿Cómo ingreso a SIGA? ¿Dónde veo las condiciones y evaluaciones? Queremos que sea el lugar al que acudir ante cualquier duda y que, cuando se necesite una atención más personalizada, conecte directamente a los estudiantes con los miembros de la Consejería, para entregarles una orientación rápida, cercana y eficiente.", "pillar": "Institucionalidad", "section": "Institucionalidad", "joint": false, "features": {"information": 1.0, "academic_information": 1.0}, "tags": ["información"], "tagsEditorial": true, "canonical": "consejeria-1"}, {"id": "consejeria-2", "number": 2, "sectionNumber": 2, "source": "consejeria", "title": "Consejería 24/7", "description": "Con el fin de agilizar la entrega de información, crearemos un grupo de difusión de WhatsApp de acceso abierto a todos, en el cual la Consejería junto con su equipo estarán constantemente informando y actualizando acerca de los proyectos, necesidades y situaciones que requieran especial atención tales como el estado de funcionamiento del quiosco, salas para evaluaciones, o situaciones de emergencia como la recientemente vivida con el aluvión.", "pillar": "Institucionalidad", "section": "Institucionalidad", "joint": false, "features": {"information": 1.0, "calendar": 0.3}, "tags": ["información"], "tagsEditorial": true, "canonical": "consejeria-2"}, {"id": "consejeria-3", "number": 3, "sectionNumber": 3, "source": "consejeria", "title": "Definición del Equipo de Consejería", "description": "Como señalamos en nuestro relato, creemos que construir una Consejería cercana comienza desde sus propios cimientos: su Equipo. Estamos convencidos de que quienes lo integran cumplen un rol fundamental, que muchas veces resulta difuso y poco visibilizado. Por ello, proponemos una estructura que permita reconocer, fortalecer y dar mayor claridad a sus funciones, mediante la creación de siete cargos para nuestro funcionamiento interno, además de los de Consejero y Subconsejero de Facultad: a. Coordinador Interno. b. Coordinador de Relaciones Institucionales. c. Coordinador de Comunicaciones. d. Encargado de Malla y Ramos. e. Encargado de Salud Mental y Comunidad. f. Encargado de Academia. g. Encargado de Rol Profesional.\n\nCada uno tendrá responsabilidades y proyectos específicos, contribuyendo a una Consejería más organizada y presente en la vida cotidiana de sus estudiantes.", "pillar": "Institucionalidad", "section": "Institucionalidad", "joint": false, "features": {"logistics": 1.0, "representation": 0.7}, "tags": ["gestión", "representación"], "tagsEditorial": true, "canonical": "consejeria-3"}, {"id": "consejeria-4", "number": 4, "sectionNumber": 4, "source": "consejeria", "title": "¡Delegue Delegado!", "description": "Creemos que los delegados académicos son un vínculo fundamental entre cada generación y la Consejería, pero que muchas veces su potencial rol no se aprovecha al máximo. Por ello, queremos potenciar su participación a través de los siguientes proyectos:\n\n• ¿Dónde está la sala?: Buscamos facilitar el día a día de los estudiantes durante la época de pruebas, difundiendo información sobre las salas en que se realizarán las distintas evaluaciones. Para esto, se compartirá información a través de historias de Instagram y en los grupos de WhatsApp de las distintas secciones.\n\n• Conexión con gradistas: Buscamos que los delegados académicos, al estar en los grupos de Whatsapp de cada una de las secciones de su generación, puedan facilitar la comunicación entre los gradistas y quienes puedan aportarles información relevante de los profesores que le tocaron en la comisión.\n\n• Toma de ramos y central de apuntes: La presencia de los delegados en los grupos de cada sección permitirá facilitar la recopilación de información, mantener estos espacios actualizados y asegurar que los estudiantes conozcan estos recursos.\n\n• Inhabilidad equipo de Consejería y delegado: Queremos establecer la incompatibilidad entre el ejercicio del cargo de delegado y la participación en el Equipo de Consejería, resguardando su independencia.\n\n• Escuchar a los delegados: Queremos que los Consejos Académicos sean una instancia efectiva para conocer y abordar las necesidades de cada generación. Para ello, incorporaremos el punto “Estado de la generación” en la tabla de los Consejos Académicos, abriendo un espacio para que los delegados puedan levantar inquietudes, compartir problemáticas particulares y proponer iniciativas.", "pillar": "Institucionalidad", "section": "Institucionalidad", "joint": false, "features": {"representation": 1.0, "information": 0.5, "degree_contacts": 0.4, "calendar": 0.3}, "tags": ["representación", "evaluaciones"], "tagsEditorial": true, "canonical": "consejeria-4"}, {"id": "consejeria-5", "number": 5, "sectionNumber": 5, "source": "consejeria", "title": "Hablemos en Serio", "description": "\n\n• 2 Reprobatorio Sabemos que la eliminación del 2 reprobatorio es una demanda que la Consejería lleva más de cuatro años impulsando, sin que hasta ahora se haya logrado concretar. Por eso, queremos transparentar qué ha ocurrido durante este tiempo, qué propuestas se han presentado, cuáles han sido las respuestas de la Facultad, cuáles son los porcentajes de aplicación y los obstáculos que han impedido avanzar. Creemos que, para lograr cambios efectivos, es fundamental contar con información clara que permita evaluar lo realizado y definir cómo seguir avanzando.\n\nEn base a dicha información, queremos reunirnos con las autoridades de la Facultad para discutir la posibilidad de modificar o eventualmente eliminar esta medida, evaluando su justificación, los efectos que su mantención o eliminación tendría en los estudiantes y en el funcionamiento de la Facultad, así como las posibles alternativas que permitan abordar las problemáticas identificadas.\n\n• Comisiones de rezago Debido a que las comisiones de rezago son un sistema nuevo cuya implementación todavía está en evaluación, queremos proponer dos medidas concretas:\n\na. Evaluación de resultados: A fin de año, tras reunir los antecedentes de los exámenes de diciembre, nos comprometemos a reunirnos con las autoridades para analizar las estadísticas y evaluar los resultados de la medida. b. Presencia obligatoria del profesor de sección: El reglamento establece que el profesor de la sección respectiva debe estar presente durante la comisión de rezago. Sin embargo, durante este semestre esta exigencia no siempre se cumplió. Por ello, queremos velar por su cumplimiento en todas las instancias, asegurando la asistencia del profesor, aun cuando sea de manera online.", "pillar": "Institucionalidad", "section": "Institucionalidad", "joint": false, "features": {"regulation": 1.0, "representation": 0.7}, "tags": ["evaluaciones", "representación"], "tagsEditorial": true, "canonical": "consejeria-5"}, {"id": "consejeria-6", "number": 6, "sectionNumber": 1, "source": "consejeria", "title": "ElectiMatch", "description": "Queremos elaborar un manual actualizado de los electivos disponibles en Casa Central, organizado por áreas, que reúna información clara sobre sus contenidos y evaluaciones, facilitando especialmente la elección a quienes deben cumplir requisitos por área. Además, incorporaremos una herramienta interactiva, a través de una plataforma como Notion, que permita a los alumnos identificar electivos acordes con sus intereses académicos y, al cargar su horario, conocer cuáles se ajustan mejor a su disponibilidad.", "pillar": "Vocación académica", "section": "Para Todos", "joint": false, "features": {"course_choice": 1.0}, "tags": ["malla"], "tagsEditorial": true, "canonical": "consejeria-6"}, {"id": "consejeria-7", "number": 7, "sectionNumber": 2, "source": "consejeria", "title": "OPR al Descubierto", "description": "Sabemos que quinto año puede ser complejo, especialmente por la escasa información sobre los OPRs. Por eso, queremos actualizar el manual de OPR y, además, solicitar a cada profesor que incorpore un video en los que presente el curso, incluyendo sus contenidos, objetivos, evaluaciones y principales atractivos, facilitando una elección más informada.", "pillar": "Vocación académica", "section": "Para Todos", "joint": false, "features": {"opr": 1.0, "course_choice": 0.5}, "tags": ["malla", "quintos"], "tagsEditorial": true, "canonical": "consejeria-7"}, {"id": "consejeria-8", "number": 8, "sectionNumber": 3, "source": "consejeria", "title": "No Más Topes", "description": "Crearemos un espacio en Notion donde cada estudiante pueda marcar los cursos y profesores que tiene durante el semestre, y que aparezca automáticamente todas las fechas de pruebas, trabajos y otras evaluaciones reunidas en un solo calendario. Así, será más fácil anticiparse a los topes y visualizar la carga académica.", "pillar": "Vocación académica", "section": "Para Todos", "joint": false, "features": {"calendar": 1.0}, "tags": ["evaluaciones"], "tagsEditorial": true, "canonical": "consejeria-8"}, {"id": "consejeria-9", "number": 9, "sectionNumber": 4, "source": "consejeria", "title": "Batalla de Aulas", "description": "En Derecho rara vez existe una única respuesta correcta y frente a los grandes dilemas nuestra respuesta suele partir con un \"depende\". Pero las discusiones doctrinarias más apasionantes suelen quedar encerradas en la sala de clases. Con este proyecto, queremos sacar la academia al aire libre y llevar los grandes debates jurídicos al patio. En cada edición, invitaremos a dos profesores con posturas evidentemente opuestas a enfrentarse en un \"cara a cara\" ágil, dinámico y abierto a las preguntas de los estudiantes.\n\nAlgunas de las batallas de aula que queremos ver en el patio: ¿Nulidad absoluta o Inexistencia jurídica? Nulidad de Derecho Público, ¿Es verdaderamente imprescriptible o debe someterse a las reglas de prescripción patrimonial? La affectio societatis ¿es un elemento de la esencia de la sociedad anónima? Y muchos más.", "pillar": "Vocación académica", "section": "Para Todos", "joint": false, "features": {"doctrine": 1.0, "dialogue": 0.4}, "tags": ["academia"], "tagsEditorial": true, "canonical": "consejeria-9"}, {"id": "consejeria-10", "number": 10, "sectionNumber": 5, "source": "consejeria", "title": "Juntos con las Asociaciones", "description": "Buscamos fortalecer el vínculo entre la Consejería y las distintas asociaciones de la Facultad, generando más espacios para darse a conocer y trabajar de manera coordinada. Para ello, proponemos las siguientes medidas:\n\n• Feria de Asociaciones: Dar continuidad a esta iniciativa con una feria semestral en el patio, donde todas las asociaciones puedan presentar sus proyectos y actividades.\n\n• Encargado de Asociaciones: Designar a un miembro de la Consejería que esté disponible para canalizar sus inquietudes y para mantener reuniones mensuales con ellas.\n\n• Calendario Compartido: Crear un calendario de actividades que permita coordinar iniciativas y evitar topes de fechas.", "pillar": "Vocación académica", "section": "Para Todos", "joint": false, "features": {"academic_community": 1.0, "participation": 0.7, "calendar": 0.4}, "tags": ["academia", "comunidad"], "tagsEditorial": true, "canonical": "consejeria-10"}, {"id": "consejeria-11", "number": 11, "sectionNumber": 6, "source": "consejeria", "title": "La Última Lección", "description": "Queremos retomar una iniciativa que tuvo una excelente acogida en años anteriores: invitar a profesores de la Facultad a impartir una clase como si fuera la última. A lo largo del año, buscaremos generar espacios para que compartan no solo sus conocimientos jurídicos, sino también sus experiencias y aprendizajes, acercando a los estudiantes a sus profesores más allá de los contenidos tradicionales.", "pillar": "Vocación académica", "section": "Para Todos", "joint": false, "features": {"professors": 1.0, "academic_community": 0.5}, "tags": ["academia", "comunidad"], "tagsEditorial": true, "canonical": "consejeria-11"}, {"id": "consejeria-12", "number": 12, "sectionNumber": 7, "source": "consejeria", "title": "Radar Académico", "description": "Queremos acompañar de cerca a nuestros compañeros en los dos momentos del año en que se publican las permanencias académicas, una instancia que sabemos puede generar incertidumbre y preocupación. Estaremos disponibles para orientar a quienes deseen apelar, guiarlos durante el procedimiento y ayudarlos a organizar su semestre, entregándoles herramientas para enfrentar este proceso con mayor claridad y tranquilidad.", "pillar": "Vocación académica", "section": "Para Todos", "joint": false, "features": {"permanence": 1.0, "support_meeting": 0.5}, "tags": ["evaluaciones", "orientación"], "tagsEditorial": true, "canonical": "consejeria-12"}, {"id": "consejeria-13", "number": 13, "sectionNumber": 8, "source": "consejeria", "title": "Juntos por el Mundo", "description": "Creemos que un intercambio es una gran oportunidad académica y personal, pero que compatibilizarlo con Derecho puede generar dudas por los costos y la posibilidad de extender la carrera. Hay muchas alternativas que muchas veces no son conocidas: la posibilidad de acceder a un intercambio por menos tiempo, la convalidación de OPRs realizados en el extranjero y la posibilidad de cursar la Clínica Jurídica en semestres no consecutivos.\n\nPor ello, en conjunto con la Vicerrectoría de Asuntos Internacionales, queremos compartir testimonios de estudiantes que ya hayan vivido un intercambio y habilitar un formulario para agendar reuniones con la Consejería para ayudarlos a planificar esta experiencia, según sus intereses y posibilidades, para que más alumnos se animen a dar el paso y aprovechar todo lo que un intercambio tiene para ofrecer.", "pillar": "Vocación académica", "section": "Para Todos", "joint": false, "features": {"exchange": 1.0, "career": 0.2}, "tags": ["intercambio"], "tagsEditorial": true, "canonical": "consejeria-13"}, {"id": "consejeria-14", "number": 14, "sectionNumber": 9, "source": "consejeria", "title": "Actualización Central Interactiva", "description": "La central interactiva de profesores está desactualizada en una variedad de aspectos; por ejemplo, existen reseñas de profesores que ya no imparten clases o falta integrar a nuevos profesores a la central.\n\nEl objetivo de este proyecto es renovar la central, lo que implica: (i) tener las reseñas de todos los profesores; (ii) uniformar el formato de las reseñas para que su contenido sea coincidente en cantidad y calidad; y (iii) lograr que las reseñas sean lo más actuales posible.", "pillar": "Vocación académica", "section": "Para Todos", "joint": false, "features": {"course_reviews": 1.0, "course_choice": 0.7}, "tags": ["malla"], "tagsEditorial": true, "canonical": "consejeria-14"}, {"id": "consejeria-15", "number": 15, "sectionNumber": 10, "source": "consejeria", "title": "De la Urna a la Malla", "description": "Elegir OPR y electivos puede ser difícil cuando falta información y referencias de otros estudiantes. Por eso, instalaremos dos urnas en el patio: una para recomendar OPR y electivos, y otra para proponer temas que les gustaría ver en futuros cursos. Así, reuniremos sus recomendaciones para compartirlas con la comunidad y canalizaremos sus\n\nintereses ante las autoridades, tal como ocurrió con el OPR Derecho de Fútbol: Instituciones, Desafíos y Resolución de Conflictos.", "pillar": "Vocación académica", "section": "Para Todos", "joint": false, "features": {"course_choice": 1.0, "expression": 0.7, "participation": 0.4}, "tags": ["malla", "participación"], "tagsEditorial": true, "canonical": "consejeria-15"}, {"id": "consejeria-16", "number": 16, "sectionNumber": 11, "source": "consejeria", "title": "Ayudante-3D", "description": "Creemos que los ayudantes son fundamentales en la formación de los estudiantes, tanto por su apoyo académico como por su cercanía y disposición. Por eso, queremos impulsar un proyecto con tres ejes concretos:\n\n• Distinción Vocación Académica: Retomar el reconocimiento, mediante votación estudiantil, a los ayudantes que destacan por su dedicación y compromiso, buscando el auspicio de un estudio jurídico para darle mayor visibilidad.\n\n• Derecho a la Transparencia: Gestionar información clara sobre los pagos y las condiciones de cada ayudantía, para que quienes postulen o ya ejerzan el cargo conozcan sus condiciones desde el inicio.\n\n• Desarrollando a los ayudantes: Buscamos organizar talleres prácticos y capacitaciones sobre herramientas y tareas habituales, como Canvas, gestión de notas en Excel, preparación de evaluaciones en línea y tramitación de justificaciones, facilitando su trabajo y fortaleciendo su desempeño.", "pillar": "Vocación académica", "section": "Para Todos", "joint": false, "features": {"teaching": 1.0, "transparency": 0.5}, "tags": ["academia", "ayudantías"], "tagsEditorial": true, "canonical": "consejeria-16"}, {"id": "consejeria-17", "number": 17, "sectionNumber": 12, "source": "consejeria", "title": "Impresión sin Filas", "description": "Hoy, Casa Central cuenta con un solo quiosco de impresión, lo que dificulta el día a día de muchos compañeros. Creemos que es una necesidad que ha persistido por mucho tiempo, y si bien se ha intentado solucionar, muchos no tienen conocimiento de esas propuestas.\n\nPor eso, queremos elaborar, junto con las demás Consejerías de Casa Central y los Consejeros Territoriales, una propuesta económica que nos permita concretar esta iniciativa, conectándonos con estudios jurídicos para evaluar la posibilidad de que este proyecto sea impulsado y financiado por ellos. Si esto no se logra, nos comprometemos a dar a conocer el esfuerzo que hicimos y los motivos por los que no se cumplieron.", "pillar": "Vocación académica", "section": "Para Todos", "joint": false, "features": {"printing": 1.0}, "tags": ["infraestructura", "estudio"], "tagsEditorial": true, "canonical": "consejeria-17"}, {"id": "consejeria-18", "number": 18, "sectionNumber": 13, "source": "consejeria", "title": "La Academia la Hacemos Juntos", "description": "Creemos que la universidad también debiese ser una instancia para explorar caminos más allá de la práctica profesional. Por eso, queremos acercar a los estudiantes a la investigación y dar mayor visibilidad a sus trabajos, a través de dos medidas:\n\n• Match de Investigación: Buscaremos generar vínculos con profesores y centros de estudios para crear una convocatoria pública que permita a los estudiantes postular a proyectos de investigación, adquirir experiencia y explorar el mundo académico.\n\n• Revista Jurídica Estudiantil: Crearemos, en colaboración con las distintas Academias, una revista anual que permita difundir investigaciones y ensayos destacados de nuestros compañeros, dando visibilidad a sus ideas más allá de la sala de clases.", "pillar": "Vocación académica", "section": "Para Todos", "joint": false, "features": {"research": 1.0, "expression": 0.5}, "tags": ["investigación", "academia"], "tagsEditorial": true, "canonical": "consejeria-18"}, {"id": "consejeria-19", "number": 19, "sectionNumber": 1, "source": "consejeria", "title": "¡Tomemos Ramos Juntos!", "description": "Sabemos que el proceso de toma de ramos puede ser una fuente de estrés, especialmente para los novatos. Por eso, proponemos las siguientes medidas:\n\n• Actualizar la Central Interactiva de los profesores.\n\n• Hacer un formulario en donde los alumnos que necesiten ayuda tomando ramos se inscriban, para luego conectarlos con un alumno más grande que los guíe.\n\n• Capacitar estratégicamente a los tutores de los paquetes para que puedan recomendar ramos y profesores según sus metodologías, evaluaciones y carga académica. Por ejemplo, si en la segunda toma siempre quedan disponibles tres profesores para un ramo, informarles de ello previamente en dicha capacitación para que después puedan orientar a cada alumno según sus necesidades y la exigencia de su semestre.", "pillar": "Vocación académica", "section": "Para los Novatos", "joint": false, "features": {"course_choice": 1.0, "mentoring": 0.6, "academic_information": 0.5}, "tags": ["novatos", "malla"], "tagsEditorial": true, "canonical": "consejeria-19"}, {"id": "consejeria-20", "number": 20, "sectionNumber": 2, "source": "consejeria", "title": "Cada loco con su método", "description": "El paso del colegio a la universidad puede ser difícil, especialmente cuando se trata de encontrar un método de estudio adecuado. Por eso, organizaremos a principios de año un taller con cinco estudiantes de generaciones más grandes que compartirán sus distintas formas de estudiar y sus consejos, para que los novatos descubran desde primer año qué método se adapta mejor a ellos.", "pillar": "Vocación académica", "section": "Para los Novatos", "joint": false, "features": {"study_methods": 1.0, "study": 0.5}, "tags": ["novatos", "estudio"], "tagsEditorial": true, "canonical": "consejeria-20"}, {"id": "consejeria-21", "number": 21, "sectionNumber": 3, "source": "consejeria", "title": "Solemne Cero", "description": "Queremos preparar a los novatos para su primera solemne oral mediante simulaciones que reproduzcan lo más fielmente posible las condiciones de una evaluación real. Para ello, realizaremos, primero, la clásica simulación con un profesor y, posteriormente, una segunda instancia con ayudantes de cada sección de Derecho Romano (al ser su primera solemne), quienes se interrogaran y entregarán retroalimentación inmediata.", "pillar": "Vocación académica", "section": "Para los Novatos", "joint": false, "features": {"oral": 1.0, "study_methods": 0.3}, "tags": ["novatos", "evaluaciones"], "tagsEditorial": true, "canonical": "consejeria-21"}, {"id": "consejeria-22", "number": 22, "sectionNumber": 1, "source": "consejeria", "title": "Tu Contacto en el Grado", "description": "Queremos facilitar la preparación del examen de grado mediante un manual con información sobre los profesores de cada comisión, sus materias favoritas, formas de preguntar y enfoques habituales. Además, cada ficha incluirá dos contactos: (1) un estudiante que haya tenido o tenga clases con los profesores de la comisión y esté dispuesto a acompañar al gradista, compartir apuntes y resolver dudas; y (2) un exalumno que haya rendido el grado con ese profesor y pueda compartir su experiencia.", "pillar": "Vocación académica", "section": "Para los Quintos y los Gradistas", "joint": false, "features": {"degree_contacts": 1.0, "mentoring": 0.4}, "tags": ["gradistas"], "tagsEditorial": true, "canonical": "consejeria-22"}, {"id": "consejeria-23", "number": 23, "sectionNumber": 2, "source": "consejeria", "title": "Rumbo a la Clínica", "description": "Sabemos que muchos llegan a la Clínica Jurídica sin tener claro cómo enfrentar las distintas situaciones. Por eso, queremos elaborar una minuta por cada Clínica, basada en la experiencia de estudiantes que la hayan cursado recientemente, con los conocimientos básicos, formas de prepararse, consejos prácticos, dificultades frecuentes y las famosas “mañas” de cada profesor, en un lenguaje sencillo y cercano.", "pillar": "Vocación académica", "section": "Para los Quintos y los Gradistas", "joint": false, "features": {"clinical": 1.0, "procurator": 0.2}, "tags": ["quintos", "profesión"], "tagsEditorial": true, "canonical": "consejeria-23"}, {"id": "consejeria-24", "number": 24, "sectionNumber": 3, "source": "consejeria", "title": "La Pregunta Semanal", "description": "Aunque el examen de grado parezca lejano, prepararse es un proceso que puede comenzar desde antes. Por eso, publicaremos semanalmente una pregunta de Derecho Civil y otra de Derecho Procesal, basadas en las temáticas consultadas en los exámenes de esa semana, para familiarizarse con sus preguntas y repasar contenidos a lo largo de la carrera.", "pillar": "Vocación académica", "section": "Para los Quintos y los Gradistas", "joint": false, "features": {"degree_practice": 1.0, "study": 0.4}, "tags": ["gradistas", "estudio"], "tagsEditorial": true, "canonical": "consejeria-24"}, {"id": "consejeria-25", "number": 25, "sectionNumber": 4, "source": "consejeria", "title": "Tu Match de Grado", "description": "Elegir una oficina de interrogadores para preparar el examen de grado puede ser difícil cuando no se conocen todas las alternativas. Por eso, proponemos llevarlas al patio para que los estudiantes de 4° y 5° año puedan conocerlas, conversar con las distintas oficinas y comparar sus métodos de preparación, eligiendo la que mejor se adapte a sus necesidades, tiempos y formas de estudio.", "pillar": "Vocación académica", "section": "Para los Quintos y los Gradistas", "joint": false, "features": {"degree_method": 1.0, "study_methods": 0.4}, "tags": ["gradistas", "quintos"], "tagsEditorial": true, "canonical": "consejeria-25"}, {"id": "consejeria-26", "number": 26, "sectionNumber": 1, "source": "consejeria", "title": "Ruta Jurídica", "description": "Queremos promover un acceso más equitativo a instancias de acercamiento al mundo profesional, como desayunos y encuentros organizados por estudios jurídicos, que muchas veces están dirigidos exclusivamente a alumnos que cumplen con determinados requisitos académicos. A través de esta iniciativa, se buscará ampliar la participación, permitiendo que todos los alumnos interesados que se inscriban puedan asistir y conocer distintas áreas del ejercicio profesional.", "pillar": "Vocación jurídica", "section": "Para todos", "joint": false, "features": {"career": 1.0, "professional_mentoring": 0.5}, "tags": ["profesión"], "tagsEditorial": true, "canonical": "consejeria-26"}, {"id": "consejeria-27", "number": 27, "sectionNumber": 2, "source": "consejeria", "title": "DuoLawyer", "description": "En conjunto con el PADE, buscamos fortalecer las habilidades en inglés jurídico mediante cursos y talleres prácticos en distintas áreas del Derecho, ampliando las herramientas y oportunidades profesionales de los estudiantes, especialmente en el ámbito internacional. Para ello, buscaremos generar convenios con instituciones especializadas, como Cambridge, y estudios jurídicos interesados en promover esta formación.", "pillar": "Vocación jurídica", "section": "Para todos", "joint": false, "features": {"legal_english": 1.0, "exchange": 0.3}, "tags": ["idiomas", "profesión"], "tagsEditorial": true, "canonical": "consejeria-27"}, {"id": "consejeria-28", "number": 28, "sectionNumber": 3, "source": "consejeria", "title": "Manual del Procurador", "description": "Comenzar a procurar implica enfrentar tareas y dinámicas que no siempre se enseñan en clases. Por eso, queremos recuperar y actualizar el Manual de Procuradores de 2017, reuniendo información práctica sobre las distintas áreas de ejercicio, las tareas habituales y las herramientas necesarias para desenvolverse en un estudio jurídico, entregando una guía útil para comenzar esta etapa con mayor seguridad.", "pillar": "Vocación jurídica", "section": "Para todos", "joint": false, "features": {"procurator": 1.0, "career": 0.3}, "tags": ["profesión"], "tagsEditorial": true, "canonical": "consejeria-28"}, {"id": "consejeria-29", "number": 29, "sectionNumber": 4, "source": "consejeria", "title": "Mentor-IA", "description": "La inteligencia artificial está transformando el ejercicio de nuestra profesión, y queremos que los estudiantes de Derecho UC cuenten con herramientas para aprovecharla de manera responsable. Por eso, buscaremos facilitar el acceso a estas herramientas mediante un convenio y, junto con la Vicerrectoría de Inteligencia Artificial, organizaremos talleres prácticos para aprender a utilizarlas responsablemente en el estudio y el trabajo jurídico, conociendo sus oportunidades y desafíos.", "pillar": "Vocación jurídica", "section": "Para todos", "joint": false, "features": {"ai": 1.0, "study": 0.3}, "tags": ["tecnología", "profesión"], "tagsEditorial": true, "canonical": "consejeria-29"}, {"id": "consejeria-30", "number": 30, "sectionNumber": 5, "source": "consejeria", "title": "Donde las Papas Queman", "description": "Queremos acercar, especialmente a los novatos, al servicio público, mostrándoles la importancia de contribuir al país desde nuestra profesión. Para ello, organizaremos visitas a organismos públicos, tribunales y servicios estatales.\n\nSin embargo, para enriquecer incluso más estas experiencias, queremos generar redes de contacto con personas que actualmente se desempeñen en estas instituciones, especialmente profesores y exalumnos de Derecho UC, quienes puedan guiar a los estudiantes durante las visitas, compartir sus experiencias y acercarlos al quehacer cotidiano de la función pública.", "pillar": "Vocación jurídica", "section": "Para todos", "joint": false, "features": {"publicservice": 1.0, "legislation": 0.3, "career": 0.4}, "tags": ["profesión", "compromiso país"], "tagsEditorial": true, "canonical": "consejeria-30"}, {"id": "consejeria-31", "number": 31, "sectionNumber": 1, "source": "consejeria", "title": "¡Yo también pasé por ahí!", "description": "La presión académica es una experiencia compartida por muchos, aunque pocas veces hablemos de ella. Por eso, queremos recopilar dos tipos de testimonios: (1) relatos anónimos de estudiantes sobre cómo enfrentaron el estrés académico y qué les ayudó, resguardando su privacidad; y (2) experiencias de profesores sobre dificultades que vivieron durante su carrera: el ramo que se echaron, la prueba que les salió pésimo, el momento en que dudaron de la carrera y cómo siguieron.", "pillar": "Vocación social", "section": "Salud Mental y Bienestar", "joint": false, "features": {"testimonials": 1.0, "mental": 0.5, "professors": 0.4}, "tags": ["salud mental", "comunidad"], "tagsEditorial": true, "canonical": "consejeria-31"}, {"id": "consejeria-32", "number": 32, "sectionNumber": 2, "source": "consejeria", "title": "Profe No Alcanzó", "description": "Creemos que el acompañamiento en salud mental es fundamental, pero que, como Consejería, también debemos abordar el problema desde su origen. Por eso, buscaremos impulsar un cambio que permita rezagar una de las solemnes o exámenes cuando a un estudiante le coincidan dos evaluaciones, orales o escritas, en un mismo día, cuyas fechas hayan sido fijadas por la Facultad, evitando así una sobrecarga académica que afecte su bienestar.", "pillar": "Vocación social", "section": "Salud Mental y Bienestar", "joint": false, "features": {"calendar": 0.8, "regulation": 0.6, "mental": 0.4}, "tags": ["evaluaciones", "salud mental"], "tagsEditorial": true, "canonical": "consejeria-32"}, {"id": "consejeria-33", "number": 33, "sectionNumber": 3, "source": "consejeria", "title": "Semana de Receson’t", "description": "Una semana pensada para salir un poco de la rutina universitaria, desconectarnos de las obligaciones y disfrutar más de la vida universitaria. Queremos organizar, en conjunto con el CADE, actividades recreativas y de relajación, como tocatas, karaoke, juegos de mesa, bachillerato, yoga durante la ventana y una Sala Destruye tu Estrés, donde podamos rayar y pintar para desahogarnos.", "pillar": "Vocación social", "section": "Salud Mental y Bienestar", "joint": true, "features": {"rest": 1.0, "community": 0.4, "music": 0.3, "art": 0.3}, "tags": ["salud mental", "comunidad"], "tagsEditorial": true, "canonical": "consejeria-33"}, {"id": "consejeria-34", "number": 34, "sectionNumber": 4, "source": "consejeria", "title": "Puertas Abiertas", "description": "La Consejería siempre estará abierta para escuchar y acompañar a los estudiantes, pero queremos asegurarnos de que cada uno tenga un espacio propio, que se adapte a sus tiempos y necesidades. Por eso, habilitaremos semanalmente un calendario para agendar reuniones personales con la Consejera y el Subconsejero, donde puedan conversar sobre sus inquietudes académicas y personales, plantear sus dudas y recibir orientación frente a los desafíos de la vida universitaria.", "pillar": "Vocación social", "section": "Salud Mental y Bienestar", "joint": false, "features": {"support_meeting": 1.0, "mental": 0.3, "academic_information": 0.4}, "tags": ["orientación", "bienestar"], "tagsEditorial": true, "canonical": "consejeria-34"}, {"id": "consejeria-35", "number": 35, "sectionNumber": 5, "source": "consejeria", "title": "Juntos, todos los días", "description": "Queremos acompañar a los estudiantes durante todo el año, especialmente en períodos de alta exigencia académica. Para ello, impulsaremos tres iniciativas:\n\n• Información a la mano: Instalaremos folletos informativos en las mesas de las bibliotecas y en las puertas de los baños dando a conocer los servicios de salud mental de la UC, como el Programa de Manejo de la Ansiedad y el Estrés y la Red de Psicólogos UC, para que todos conozcan las alternativas de apoyo disponibles.\n\n• Un café para seguir: Durante las semanas de solemnes, la Consejería recorrerá las bibliotecas repartiendo café el día previo a las evaluaciones, como un pequeño gesto para acompañar a quienes se encuentran estudiando.\n\n• Proyecto Guau: En coordinación con Salud y Bienestar Estudiantil UC, queremos llevar perros de apoyo emocional a las bibliotecas durante las semanas de solemnes, ofreciendo un espacio para desconectarse y recargar energías.", "pillar": "Vocación social", "section": "Salud Mental y Bienestar", "joint": false, "features": {"mental": 0.7, "rest": 0.7, "testimonials": 0.3}, "tags": ["salud mental", "bienestar"], "tagsEditorial": true, "canonical": "consejeria-35"}, {"id": "consejeria-36", "number": 36, "sectionNumber": 6, "source": "consejeria", "title": "Automedicación: ¿A qué costo?", "description": "Queremos generar conciencia sobre los riesgos de la automedicación, una práctica que puede normalizarse entre los estudiantes durante los períodos de mayor exigencia académica. Para ello, impulsaremos tres iniciativas:\n\n• Infórmate antes de consumir: Organizaremos una charla con un profesional médico para explicar los riesgos de la automedicación y resolver dudas de los estudiantes.\n\n• Lo que no se cuenta: Llevaremos a cabo una charla testimonial con un profesional que haya recurrido a la automedicación durante su etapa universitaria, para compartir su experiencia y reflexionar sobre los riesgos de esta práctica.\n\n• Yo también pensé que era normal: Realizaremos una encuesta anónima para identificar qué tan frecuente es la automedicación en la Facultad, sus principales causas y el conocimiento de sus riesgos. A partir de los resultados, propondremos medidas concretas de prevención y de apoyo.", "pillar": "Vocación social", "section": "Salud Mental y Bienestar", "join
